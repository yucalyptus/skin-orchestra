<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="1170" height="660" style="background:#fff" font-family="system-ui,-apple-system,sans-serif"><defs><marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#2B4C7E"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#4F8468"/></marker><marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#6B4CA3"/></marker><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#B0466B"/></marker><marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#C9832F"/></marker></defs><rect x="2" y="2" width="776" height="436" rx="12" fill="#fff" stroke="#9FB0C8" stroke-width="1.6"/><text x="24" y="34" font-size="17" font-weight="700" fill="#2B4C7E">解糖系の主役は、ATPではなく「炭素の行き先」</text><text x="24" y="60" font-size="12" fill="#5A6782">細胞質でおきる10段を、幹1本に圧縮して描く（律速は①②③の3か所だけ示す）</text><line x1="40" y1="150" x2="300" y2="150" stroke="#5A6782" stroke-width="2.5" marker-end="url(#aN)"/><rect x="24" y="136" width="72" height="28" rx="6" fill="#EDF1F8" stroke="#93A1B8"/><text x="60" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#33415C">glucose</text><circle cx="118" cy="150" r="11" fill="#fff" stroke="#C9832F" stroke-width="2"/><text x="118" y="154.5" font-size="11" font-weight="700" text-anchor="middle" fill="#C9832F">①</text><text x="118" y="180" font-size="10.5" text-anchor="middle" fill="#5A6782">hexokinase</text><circle cx="196" cy="150" r="11" fill="#fff" stroke="#C9832F" stroke-width="2"/><text x="196" y="154.5" font-size="11" font-weight="700" text-anchor="middle" fill="#C9832F">②</text><text x="196" y="180" font-size="10.5" text-anchor="middle" fill="#5A6782">PFK-1</text><circle cx="268" cy="150" r="11" fill="#fff" stroke="#C9832F" stroke-width="2"/><text x="268" y="154.5" font-size="11" font-weight="700" text-anchor="middle" fill="#C9832F">③</text><text x="268" y="180" font-size="10.5" text-anchor="middle" fill="#5A6782">PK/PKM2</text><text x="126" y="140" font-size="10.5" text-anchor="end" fill="#5A6782">G6P</text><text x="232" y="128" font-size="10.5" text-anchor="middle" fill="#5A6782">F6P …</text><path d="M150 136 L150 96" fill="none" stroke="#4F8468" stroke-width="2.5" marker-end="url(#aG)"/><rect x="88" y="66" width="196" height="28" rx="7" fill="#E7F1EA" stroke="#4F8468"/><text x="186" y="85" font-size="12" text-anchor="middle" fill="#4F8468">pentose phosphate pathway</text><text x="296" y="85" font-size="12" fill="#4F8468">→ NADPH（還元力）</text><circle cx="352" cy="150" r="42" fill="#FFF8E8" stroke="#C9832F" stroke-width="2.5"/><text x="352" y="147" font-size="14" font-weight="700" text-anchor="middle" fill="#33415C">pyruvate</text><text x="352" y="164" font-size="10.5" text-anchor="middle" fill="#5A6782">2分子</text><path d="M394 122 L470 84" fill="none" stroke="#2B4C7E" stroke-width="6" marker-end="url(#aN)"/><rect x="480" y="56" width="272" height="56" rx="8" fill="#EDF1F8" stroke="#2B4C7E" stroke-width="1.4"/><text x="494" y="78" font-size="13" font-weight="700" fill="#2B4C7E">① ミトコンドリアへ</text><text x="494" y="98" font-size="11.5" fill="#33415C">PDH → acetyl-CoA → TCA回路 → 電子伝達系</text><text x="640" y="78" font-size="12" font-weight="700" fill="#B04A33">ここで約30〜32 ATP</text><path d="M396 150 L470 150" fill="none" stroke="#6B4CA3" stroke-width="6" marker-end="url(#aP)"/><rect x="480" y="124" width="272" height="52" rx="8" fill="#EFEAF7" stroke="#6B4CA3" stroke-width="1.4"/><text x="494" y="145" font-size="13" font-weight="700" fill="#6B4CA3">② lactate へ（LDH）</text><text x="494" y="164" font-size="11.5" fill="#33415C">NADH → NAD⁺ を再生。老廃物ではない</text><path d="M394 178 L470 216" fill="none" stroke="#B0466B" stroke-width="6" marker-end="url(#aK)"/><rect x="480" y="190" width="272" height="52" rx="8" fill="#FAEBF0" stroke="#B0466B" stroke-width="1.4"/><text x="494" y="211" font-size="13" font-weight="700" fill="#B0466B">③ 生合成へ</text><text x="494" y="230" font-size="11.5" fill="#33415C">アミノ酸・脂質・核酸の材料になる</text><rect x="24" y="228" width="300" height="86" rx="8" fill="#FDF3E4" stroke="#C9832F" stroke-width="1.3"/><text x="40" y="250" font-size="12.5" font-weight="700" fill="#C9832F">解糖系のATP収支</text><text x="40" y="272" font-size="12" fill="#33415C">前半に 2 ATP を投資 → 後半に 4 ATP を回収</text><text x="40" y="296" font-size="14" font-weight="700" fill="#33415C">正味 2 ATP ＋ 2 NADH</text><text x="200" y="296" font-size="11.5" fill="#5A6782">（ミトコンドリアの約1/15）</text><rect x="24" y="330" width="300" height="52" rx="8" fill="#F6F8FC" stroke="#C4CCDA"/><text x="40" y="351" font-size="12" fill="#33415C">増殖・修復中の細胞 → <tspan font-weight="700">HIF-1α</tspan> → 解糖への依存が上がる</text><text x="40" y="370" font-size="11" fill="#5A6782">発電が目的ではなく、材料と NAD⁺ 再生を早く回すため</text><rect x="24" y="396" width="728" height="30" rx="8" fill="#FFF8E8" stroke="#C9832F" stroke-width="1.2"/><text x="388" y="416" font-size="13.5" font-weight="700" text-anchor="middle" fill="#33415C">ATPを作る工程としては割に合わない。決めているのは、炭素が次にどこへ行くか</text></svg>