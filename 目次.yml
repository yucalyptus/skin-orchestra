# 目次 ―― セクション・部・並び順の正典。順番を持つのはこのファイルだけ。
#
# 章を足す   : chapters に id を1行足し、chapters/ に同じ id を持つmdを置く
# 章を動かす : この行を動かす
# 章を分ける : id を2つにして両方の行を置く
# 並べ替えはこのファイルで行う。追加・分割時は本文・参照・内容設計も確認する。
# 制作手順は README.md を参照。
#
# id は公開URLになる（例: glycolysis → glycolysis.html）。
# 一度公開した id は変えない。変えると読者のリンクが切れる。
#
# 構造は2階層。section（読者に見せる大区分）> part（部）> 章。
# part を持たない section は、章を直下に置く（美容内科・おわりに）。

sections:

  # =========================================================================
  - section: 生化学・細胞生物学の基礎
    subtitle: 細胞のしくみを思い出す
    parts:

      - part: 細胞の地図
        intro: 細胞とオルガネラの基本を確認し、エネルギーや材料の供給、分解と再利用、情報のやり取りが、細胞の仕事をどう支えるかを学びます。
        chapters:
          - cell                      # 細胞とは何か
          - organelles                # オルガネラ
          - cell-types                # オルガネラはどう連携するか

      - part: 情報をどう読むか
        intro: 連携するオルガネラの仕事の一例として、DNAの情報からタンパク質を作り、送り出す流れをたどります。続いて、使う遺伝子の調節、細胞の外から届く刺激、細胞膜を通る物質の出入りを見ていきます。細胞が放出する膜小胞を通じた情報のやり取りと、まだ解明されていない点も学びます。
        chapters:
          - dna-to-protein            # DNAからタンパク質まで
          - epigenome                 # エピゲノム
          - receptors-signaling       # 受容体と細胞内シグナル
          - membrane-transport        # 細胞膜と物質輸送
          - extracellular-vesicles    # 細胞外小胞とエクソソーム

      - part: エネルギー
        intro: 細胞が働き、組織を維持するには、エネルギーと合成の材料が必要です。糖や脂肪からエネルギーを取り出す過程と、その途中で生じる物質が新しい分子の材料にもなることを学びます。
        chapters:
          - atp                       # 代謝とATP
          - glycolysis                # 解糖系
          - fatty-acid-oxidation      # 脂肪酸とケトン体
          - tca-cycle                 # TCA回路
          - electron-transport        # 電子伝達系
          - nad                       # NAD⁺

      - part: 材料を感知し作る
        intro: アミノ酸はタンパク質の材料であり、栄養が足りていることを細胞に伝える役割も持ちます。細胞が栄養や成長の刺激を受け取り、タンパク質の合成を調節する仕組みを学びます。
        chapters:
          - amino-acids               # アミノ酸は材料でありシグナルでもある
          - mtorc1                    # mTORC1はアミノ酸をどう感知するか

      - part: 掃除と作り直し
        intro: 細胞は、傷んだタンパク質や細胞内の構造を分解し、その材料を再利用します。ミトコンドリアの修復・除去・新生と、栄養やエネルギーの状態に応じて合成と分解を調節する仕組みを学びます。
        chapters:
          - autophagy                 # オートファジーとリソソーム
          - mito-quality-control      # ミトコンドリア品質管理
          - ampk-mtor                 # AMPKとmTOR

      - part: 傷害から修復まで
        intro: 活性酸素による傷害と、それを抑える仕組みを学びます。続いて、傷んだ細胞の死と除去、炎症の収束、組織の修復をたどり、施術後の回復や瘢痕・色素沈着につながる反応を理解します。
        chapters:
          - oxidative-stress          # 酸化ストレスと抗酸化
          - cell-death                # 細胞死
          - wound-healing             # 炎症と創傷治癒

      - part: 細胞は加齢で何が変わるか
        intro: 細胞の増殖・代謝・分泌が加齢とともにどう変化し、組織を維持する力に影響するかを学びます。細胞が分裂する仕組みを復習し、老化した細胞が周囲に及ぼす作用や、ミトコンドリアとの関係を見ていきます。
        chapters:
          - cell-cycle                # 細胞周期
          - hallmarks-of-aging        # Hallmarks of Aging
          - senescence                # 細胞老化
          - mito-dysfunction          # ミトコンドリア機能不全と細胞老化

  # =========================================================================
  - section: 美容皮膚科
    subtitle: 組織と病態から治療を理解する
    parts:

      # 組織の構造と働きが中心。具体的な治療の説明は治療別の章へ。
      - part: 組織の生化学
        intro: 表皮、色素を作る細胞、真皮の線維、皮脂腺や毛包、脂肪・筋肉・血管を取り上げます。それぞれを構成する細胞と物質、その働きが、皮膚の見た目や組織の性質にどうつながるかを学びます。
        chapters:
          - epidermis                 # 表皮とターンオーバー
          - melanocytes               # メラノサイトと色素形成

          - ecm                       # 細胞外基質（ECM）
          - fibroblast-collagen       # 線維芽細胞とコラーゲン
          - elastic-fibers            # 弾性線維と膠原線維
          - glycation                 # 糖化とAGE

          - sebum                     # 皮脂分泌の生化学
          - hair-follicle             # 毛と毛包

          - adipose                   # 脂肪
          - muscle                    # 筋肉

          - endothelium               # 血管と内皮

      - part: 訴えを細胞から読み解く
        intro: 紅斑・色素斑・くすみ・たるみを、関与する細胞と組織の変化から整理します。共通の機序を理解し、疾患ごとの病態と治療標的につなげます。
        chapters:
          - erythema                  # 赤みの生化学
          - pigmentation              # しみとくすみ
          - sagging                   # たるみの多層構造

      - part: 疾患・病態を細胞から理解する
        intro: 肝斑・酒さ・痤瘡など、臨床で診る疾患を細胞と組織の反応から理解します。臨床所見、病態の機序、治療標的をつなぎ、薬剤や機器の詳細は治療別の章で扱います。
        chapters:
          - rosacea                  # 酒さ
          - seborrheic-dermatitis    # 脂漏性皮膚炎
          - acne                     # 尋常性痤瘡
          - solar-lentigo            # 日光黒子と雀卵斑
          - melasma                  # 肝斑
          - pih                      # 炎症後色素沈着
          - dermal-melanocytosis     # 真皮メラノサイトーシス（ADM・太田母斑）

      - part: 外用
        intro: 皮膚に塗った成分がどこまで届き、どの細胞や構造に作用するかを学びます。角層のバリアを出発点に、表皮の分化、色素の産生、角層の剥離など、治療ごとに異なる作用を見ていきます。
        chapters:
          - skin-penetration          # 角層バリアと経皮吸収（外用の総論）
          - retinoids                 # レチノイド外用の生化学
          - skin-lightening           # 美白外用の生化学
          - chemical-peel             # ケミカルピーリングの生化学

      # 置く → 誘導する → 止める → 壊す の順。同じ注射でも一次作用が違う。
      - part: 注射
        intro: 組織に直接届けた製剤が何を変えるかを学びます。体積を補う、組織の形成を促す、神経から筋への信号を抑える、脂肪細胞を傷害するといった作用の違いを、製剤ごとの根拠とともに見ていきます。
        chapters:
          - ha-filler                 # ヒアルロン酸フィラーの生化学
          - biostimulators            # バイオスティミュレーター
          - skin-boosters             # 肌育治療を細胞生物学で読む
          - exosomes                  # エクソソームと幹細胞培養上清
          - botulinum                 # ボツリヌストキシンの生化学
          - fat-reduction             # 脂肪を減らす治療

      - part: デバイス
        intro: デバイスは熱・光・機械刺激や電気・磁気刺激を組織に与えます。刺激による直接の変化と、その後の細胞の応答を見ていきます。
        chapters:
          - energy-devices            # 熱・光・機械刺激（総論）
          - microneedling-rf          # ニードルRFの生化学
          - hifu                      # HIFUの生化学
          - fractional-laser          # フラクショナルレーザーの生化学
          - ipl                       # IPL
          - pigment-laser             # Qスイッチ・ピコ秒レーザー
          - vascular-laser            # 血管レーザー
          - pbm                       # PBM・LEDの生化学
          - plasma                    # プラズマ治療
          - transdermal-delivery      # 導入（組織に働きかけず、外用剤を角層の向こうへ運ぶ）

  # =========================================================================
  # 標的が皮膚の特定構造なら美容皮膚科、全身に入れて全身を動かすなら美容内科。
  # 内服でもトラネキサム酸は skin-lightening、isotretinoin は sebum に置く。
  - section: 美容内科
    subtitle: 全身の代謝と加齢から考える
    intro: 栄養素の補充、老化した細胞への介入、腸内細菌などを、全身の代謝や加齢との関係から学びます。体内での働きと、介入によってヒトで確かめられた変化を結びつけて考えます。
    chapters:
      - nad-precursors                # NAD⁺前駆体
      - senolytics                    # senolytic・mitophagy関連介入
      - antioxidant-supplements       # 抗酸化サプリメントと点滴
      - gut-microbiome                # 腸内細菌

  # =========================================================================
  - section: おわりに
    chapters:
      - conclusion                    # 美容医療を細胞から考える
