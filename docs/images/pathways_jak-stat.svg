<svg xmlns="http://www.w3.org/2000/svg" width="760" height="750" viewBox="0 0 760 750" role="img" aria-labelledby="title"><title id="title">JAK–STAT｜サイトカインから核へ</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1d4f91"/></marker></defs><rect width="760" height="750" fill="white"/><g font-family="Hiragino Sans, Noto Sans JP, sans-serif" fill="#1c1d23">
<text x="30" y="40" text-anchor="start" font-size="25" fill="#1c1d23" font-weight="600">JAK–STAT｜サイトカインから核へ</text>
<rect x="20" y="175" width="720" height="525" rx="24" fill="#f2f4f7" stroke="#c5cdd6" stroke-width="2"/>
<text x="40" y="92" text-anchor="start" font-size="17" fill="#64748b" font-weight="400">細胞外</text>
<text x="380" y="105" text-anchor="middle" font-size="23" fill="#1c1d23" font-weight="600">インターフェロンなどのサイトカイン</text>
<path d="M380 120 L380 148" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<path d="M20 173 H740 M20 183 H740" stroke="#c5cdd6" stroke-width="3"/>
<text x="46" y="165" text-anchor="start" font-size="17" fill="#64748b" font-weight="400">細胞膜</text>
<rect x="220.0" y="150.0" width="320" height="54" rx="14" fill="white" stroke="#1d4f91" stroke-width="2"/>
<text x="380" y="184" text-anchor="middle" font-size="21" fill="#1c1d23" font-weight="400">それぞれの受容体</text>
<text x="43" y="229" text-anchor="start" font-size="17" fill="#64748b" font-weight="400">細胞質</text>
<rect x="300.0" y="229.0" width="160" height="54" rx="14" fill="white" stroke="#1d4f91" stroke-width="2"/>
<text x="380" y="263" text-anchor="middle" font-size="21" fill="#1c1d23" font-weight="400">JAK</text>
<path d="M380 205 L380 226" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="583" y="260" text-anchor="middle" font-size="18" fill="#64748b" font-weight="400">受容体の細胞内側</text>
<rect x="290.0" y="327.0" width="180" height="54" rx="14" fill="white" stroke="#1d4f91" stroke-width="2"/>
<text x="380" y="361" text-anchor="middle" font-size="21" fill="#1c1d23" font-weight="400">STAT</text>
<path d="M380 285 L380 325" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="396.0" y="305.0" text-anchor="start" font-size="17" fill="#64748b" font-weight="400">リン酸化</text>
<text x="380" y="437" text-anchor="middle" font-size="22" fill="#1c1d23" font-weight="400">STATどうしが組になる（二量体）</text>
<path d="M380 383 L380 407" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<rect x="110" y="500" width="540" height="165" rx="55" fill="#ffffff" stroke="#1d4f91" stroke-width="2"/>
<text x="147" y="535" text-anchor="middle" font-size="19" fill="#1d4f91" font-weight="400">核</text>
<path d="M380 452 L380 530" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="396.0" y="491.0" text-anchor="start" font-size="17" fill="#64748b" font-weight="400">核へ移動</text>
<text x="380" y="571" text-anchor="middle" font-size="23" fill="#1c1d23" font-weight="400">STATが遺伝子発現を調節</text>
<text x="380" y="616" text-anchor="middle" font-size="21" fill="#1c1d23" font-weight="400">免疫・炎症・増殖などの応答</text>
<text x="30" y="732" text-anchor="start" font-size="16" fill="#64748b" font-weight="400">矢印：代表的な信号の流れ。途中の分子・分岐は一部省略。</text>
</g></svg>