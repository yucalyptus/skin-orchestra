<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 618" role="img" aria-label="中性脂肪の構造"><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#667085" stroke-width="1.6"/></marker></defs><rect width="760" height="618" fill="white"/><g font-family="system-ui,-apple-system,sans-serif"><text x="32" y="46" font-size="28" fill="#202124" text-anchor="start" font-weight="700">中性脂肪の構造</text><text x="32" y="88" font-size="24" fill="#202124" text-anchor="start" font-weight="400">glycerol の骨格に、脂肪酸が3本つながる</text><g transform="translate(0 40)"><text x="46" y="238" font-size="24" fill="#202124" text-anchor="start" font-weight="700">glycerol</text><text x="46" y="273" font-size="22" fill="#202124" text-anchor="start" font-weight="400">1個</text><path d="M185 139H174V364H185" stroke="#667085" stroke-width="2" fill="none"/><text x="247" y="165" font-size="30" fill="#202124" text-anchor="end" font-weight="400">H₂C</text><line x1="258" y1="154" x2="288" y2="154" stroke="#667085" stroke-width="2"/><text x="307" y="165" font-size="30" fill="#245da8" text-anchor="middle" font-weight="400">O</text><line x1="326" y1="154" x2="356" y2="154" stroke="#245da8" stroke-width="3"/><text x="377" y="165" font-size="30" fill="#202124" text-anchor="middle" font-weight="400">C</text><line x1="372" y1="133" x2="372" y2="114" stroke="#667085" stroke-width="2"/><line x1="382" y1="133" x2="382" y2="114" stroke="#667085" stroke-width="2"/><text x="377" y="105" font-size="28" fill="#202124" text-anchor="middle" font-weight="400">O</text><line x1="396" y1="154" x2="428" y2="154" stroke="#667085" stroke-width="2"/><text x="448" y="165" font-size="30" fill="#202124" text-anchor="start" font-weight="400">R¹</text><text x="247" y="260" font-size="30" fill="#202124" text-anchor="end" font-weight="400">HC</text><line x1="258" y1="249" x2="288" y2="249" stroke="#667085" stroke-width="2"/><text x="307" y="260" font-size="30" fill="#245da8" text-anchor="middle" font-weight="400">O</text><line x1="326" y1="249" x2="356" y2="249" stroke="#245da8" stroke-width="3"/><text x="377" y="260" font-size="30" fill="#202124" text-anchor="middle" font-weight="400">C</text><line x1="372" y1="228" x2="372" y2="209" stroke="#667085" stroke-width="2"/><line x1="382" y1="228" x2="382" y2="209" stroke="#667085" stroke-width="2"/><text x="377" y="200" font-size="28" fill="#202124" text-anchor="middle" font-weight="400">O</text><line x1="396" y1="249" x2="428" y2="249" stroke="#667085" stroke-width="2"/><text x="448" y="260" font-size="30" fill="#202124" text-anchor="start" font-weight="400">R²</text><text x="247" y="355" font-size="30" fill="#202124" text-anchor="end" font-weight="400">H₂C</text><line x1="258" y1="344" x2="288" y2="344" stroke="#667085" stroke-width="2"/><text x="307" y="355" font-size="30" fill="#245da8" text-anchor="middle" font-weight="400">O</text><line x1="326" y1="344" x2="356" y2="344" stroke="#245da8" stroke-width="3"/><text x="377" y="355" font-size="30" fill="#202124" text-anchor="middle" font-weight="400">C</text><line x1="372" y1="323" x2="372" y2="304" stroke="#667085" stroke-width="2"/><line x1="382" y1="323" x2="382" y2="304" stroke="#667085" stroke-width="2"/><text x="377" y="295" font-size="28" fill="#202124" text-anchor="middle" font-weight="400">O</text><line x1="396" y1="344" x2="428" y2="344" stroke="#667085" stroke-width="2"/><text x="448" y="355" font-size="30" fill="#202124" text-anchor="start" font-weight="400">R³</text><line x1="228" y1="176" x2="228" y2="229" stroke="#667085" stroke-width="2"/><line x1="228" y1="271" x2="228" y2="324" stroke="#667085" stroke-width="2"/><text x="565" y="232" font-size="24" fill="#202124" text-anchor="start" font-weight="700">脂肪酸由来</text><text x="565" y="267" font-size="22" fill="#202124" text-anchor="start" font-weight="400">の部分 ×3</text><path d="M513 99H525V365H513" stroke="#667085" stroke-width="2" fill="none"/><line x1="32" y1="397" x2="728" y2="397" stroke="#d1d5db" stroke-width="2"/><text x="32" y="441" font-size="24" fill="#245da8" text-anchor="start" font-weight="700">青い O–C の結合が、加水分解で切れる</text><text x="32" y="481" font-size="20" fill="#202124" text-anchor="start" font-weight="400">R¹・R²・R³ は脂肪酸の炭化水素鎖を省略した記号</text><text x="32" y="513" font-size="22" fill="#202124" text-anchor="start" font-weight="400">例：palmitate では R = (CH₂)₁₄–CH₃</text><text x="32" y="548" font-size="20" fill="#202124" text-anchor="start" font-weight="400">カルボニルの炭素 C を含め、脂肪酸全体で炭素16個</text></g></g></svg>