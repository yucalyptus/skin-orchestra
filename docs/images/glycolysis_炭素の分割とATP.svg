<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">炭素6個の糖を、炭素3個の2分子へ分ける</title><desc id="desc">丸は炭素の個数を示す模式記号。グルコース1分子の6個の炭素が、準備と分割を経て炭素3個ずつの中間体2分子となり、ピルビン酸2分子になる。前半にATP2個を使い、後半にATP4個とNADH2分子を作る。正味ATP2個。分子の立体構造や全反応式ではない。</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#59636e" stroke-width="1.7"/></marker></defs><rect width="760" height="520" fill="white"/><g font-family="system-ui,-apple-system,sans-serif"><text x="380" y="42" font-size="28" fill="#202124" font-weight="700" text-anchor="middle">炭素6個の糖を、炭素3個の2分子へ分ける</text><text x="116" y="113" font-size="28" fill="#202124" font-weight="700" text-anchor="middle">glucose</text><text x="116" y="146" font-size="23" fill="#202124" font-weight="400" text-anchor="middle">1分子</text><text x="379" y="113" font-size="26" fill="#202124" font-weight="700" text-anchor="middle">中間体</text><text x="379" y="146" font-size="22" fill="#202124" font-weight="400" text-anchor="middle">炭素3個 × 2分子</text><text x="650" y="113" font-size="28" fill="#202124" font-weight="700" text-anchor="middle">pyruvate</text><text x="650" y="146" font-size="23" fill="#202124" font-weight="400" text-anchor="middle">2分子</text><circle cx="83" cy="225" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="83" cy="258" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="116" cy="225" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="116" cy="258" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="149" cy="225" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="149" cy="258" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="346" cy="212" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="379" cy="212" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="412" cy="212" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="346" cy="304" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="379" cy="304" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="412" cy="304" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="617" cy="212" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="650" cy="212" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="683" cy="212" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="617" cy="304" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="650" cy="304" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><circle cx="683" cy="304" r="13" fill="#dce8f2" stroke="#245b91" stroke-width="2"/><path d="M177 241H230" fill="none" stroke="#59636e" stroke-width="2.3" marker-end="url(#tip)"/><path d="M230 241Q256 241 276 212H322" fill="none" stroke="#59636e" stroke-width="2.3" marker-end="url(#tip)"/><path d="M230 241Q256 241 276 304H322" fill="none" stroke="#59636e" stroke-width="2.3" marker-end="url(#tip)"/><path d="M428 212H595" fill="none" stroke="#59636e" stroke-width="2.3" marker-end="url(#tip)"/><path d="M428 304H595" fill="none" stroke="#59636e" stroke-width="2.3" marker-end="url(#tip)"/><text x="252" y="185" font-size="22" fill="#59636e" font-weight="400" text-anchor="middle">準備・分割</text><text x="509" y="258" font-size="22" fill="#59636e" font-weight="400" text-anchor="middle">後半の反応</text><path d="M192 351H319" fill="none" stroke="#59636e" stroke-width="2.3"/><text x="255" y="384" font-size="24" fill="#245b91" font-weight="700" text-anchor="middle">2 ATPを使う</text><path d="M442 351H723" fill="none" stroke="#59636e" stroke-width="2.3"/><text x="580" y="383" font-size="24" fill="#245b91" font-weight="700" text-anchor="middle">4 ATPを作る</text><text x="580" y="414" font-size="22" fill="#245b91" font-weight="400" text-anchor="middle">2 NADHもできる</text><text x="244" y="453" font-size="26" fill="#202124" font-weight="700" text-anchor="middle">差し引き、正味2 ATP</text><text x="380" y="499" font-size="22" fill="#59636e" font-weight="400" text-anchor="middle">丸1個＝炭素1個。炭素数の分配を示し、分子構造は表さない。</text></g></svg>