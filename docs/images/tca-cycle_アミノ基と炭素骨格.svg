<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="title desc"><title id="title">ALTはアミノ基を移す</title><desc id="desc">アラニンの炭素骨格はピルビン酸になる。アミノ基はαケトグルタル酸へ移され、グルタミン酸になる。丸は炭素数、青いNはアミノ基の窒素を示し、化学構造の細部と逆反応を省略。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596573"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245da8"/></marker></defs><rect width="800" height="580" fill="white"/><g font-family="system-ui,-apple-system,sans-serif" text-anchor="middle" fill="#202124"><text x="400" y="40" font-size="29" font-weight="700" fill="#202124">ALTは、アミノ基を別の分子へ移す</text><text x="185" y="92" font-size="27" font-weight="700" fill="#202124">alanine</text><text x="185" y="123" font-size="23" font-weight="400" fill="#202124">アラニン</text><text x="600" y="92" font-size="27" font-weight="700" fill="#202124">α-ketoglutarate</text><text x="600" y="123" font-size="23" font-weight="400" fill="#202124">α-ケトグルタル酸</text><path d="M151.0 211H219.0" stroke="#596573" stroke-width="3"/><circle cx="151.0" cy="211" r="12" fill="#596573"/><circle cx="185.0" cy="211" r="12" fill="#596573"/><circle cx="219.0" cy="211" r="12" fill="#596573"/><path d="M185 182V202" stroke="#245da8" stroke-width="3"/><circle cx="185" cy="164" r="20" fill="#e6eef8" stroke="#245da8" stroke-width="2"/><text x="185" y="172" font-size="24" font-weight="700" fill="#245da8">N</text><path d="M532.0 211H668.0" stroke="#596573" stroke-width="3"/><circle cx="532.0" cy="211" r="12" fill="#596573"/><circle cx="566.0" cy="211" r="12" fill="#596573"/><circle cx="600.0" cy="211" r="12" fill="#596573"/><circle cx="634.0" cy="211" r="12" fill="#596573"/><circle cx="668.0" cy="211" r="12" fill="#596573"/><path d="M185 237V354" fill="none" stroke="#596573" stroke-width="3" marker-end="url(#a)"/><path d="M600 237V301" fill="none" stroke="#596573" stroke-width="3" marker-end="url(#a)"/><path d="M212 166C349 166 401 282 552 320" fill="none" stroke="#245da8" stroke-width="4" marker-end="url(#b)"/><text x="387" y="159" font-size="25" font-weight="700" fill="#245da8">アミノ基が移る</text><text x="373" y="306" font-size="25" font-weight="700" fill="#245da8">ALT</text><path d="M151.0 384H219.0" stroke="#596573" stroke-width="3"/><circle cx="151.0" cy="384" r="12" fill="#596573"/><circle cx="185.0" cy="384" r="12" fill="#596573"/><circle cx="219.0" cy="384" r="12" fill="#596573"/><path d="M532.0 384H668.0" stroke="#596573" stroke-width="3"/><circle cx="532.0" cy="384" r="12" fill="#596573"/><circle cx="566.0" cy="384" r="12" fill="#596573"/><circle cx="600.0" cy="384" r="12" fill="#596573"/><circle cx="634.0" cy="384" r="12" fill="#596573"/><circle cx="668.0" cy="384" r="12" fill="#596573"/><path d="M600 355V375" stroke="#245da8" stroke-width="3"/><circle cx="600" cy="337" r="20" fill="#e6eef8" stroke="#245da8" stroke-width="2"/><text x="600" y="345" font-size="24" font-weight="700" fill="#245da8">N</text><text x="185" y="435" font-size="27" font-weight="700" fill="#202124">pyruvate</text><text x="185" y="466" font-size="23" font-weight="400" fill="#202124">ピルビン酸</text><text x="600" y="435" font-size="27" font-weight="700" fill="#202124">glutamate</text><text x="600" y="466" font-size="23" font-weight="400" fill="#202124">グルタミン酸</text><text x="185" y="510" font-size="23" font-weight="700" fill="#202124">炭素骨格を代謝に使う</text><text x="600" y="510" font-size="23" font-weight="700" fill="#245da8">窒素を受け取る</text><path d="M24 532H776" stroke="#d5d9df"/><text x="400" y="563" font-size="19" font-weight="400" fill="#202124">●：炭素　N：アミノ基の窒素。構造の細部・逆反応・補酵素は省略。</text></g></svg>