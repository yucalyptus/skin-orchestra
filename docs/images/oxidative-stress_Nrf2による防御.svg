<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img"><title>Nrf2による抗酸化能力の増強</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#1d4f91"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif} </style><rect width="1000" height="780" fill="white"/><text x="40" y="55" font-size="31" fill="#1c1d23" text-anchor="start">Nrf2は、抗酸化に必要な酵素や分子を増やす</text><rect x="40" y="96" width="920" height="377" rx="18" fill="#f2f4f7"/><text x="72" y="135" font-size="20" fill="#1c1d23" text-anchor="start">細胞質</text><rect x="70" y="165" width="330" height="115" rx="18" fill="#f2f4f7"/><text x="92" y="207" font-size="27" fill="#1c1d23" text-anchor="start">酸化ストレス</text><text x="92" y="249" font-size="21" fill="#1c1d23" text-anchor="start">KEAP1のcysteineが変化</text><path d="M235 286 L235 342" stroke="#1d4f91" fill="none" stroke-width="3" marker-end="url(#a)"/><text x="90" y="391" font-size="24" fill="#1c1d23" text-anchor="start">Nrf2が分解を免れる</text><path d="M404 380 L552 380" stroke="#1d4f91" fill="none" stroke-width="3" marker-end="url(#a)"/><text x="435" y="352" font-size="19" fill="#1c1d23" text-anchor="start">核へ</text><ellipse cx="748" cy="290" rx="186" ry="147" fill="#f2f4f7" stroke="#64748b" stroke-width="2"/><text x="735" y="192" font-size="23" fill="#1c1d23" text-anchor="start">核</text><text x="639" y="256" font-size="32" fill="#1c1d23" text-anchor="start">Nrf2</text><path d="M620 298 Q685 250 750 298 T880 298 M620 275 Q685 323 750 275 T880 275" stroke="#64748b" fill="none" stroke-width="3"/><text x="639" y="343" font-size="22" fill="#1c1d23" text-anchor="start">遺伝子の発現を高める</text><path d="M748 445 L748 518" stroke="#1d4f91" fill="none" stroke-width="3" marker-end="url(#a)"/><text x="40" y="526" font-size="25" fill="#1c1d23" text-anchor="start">増える防御</text><rect x="40" y="552" width="920" height="90" rx="18" fill="#f2f4f7"/><text x="65" y="590" font-size="24" fill="#1c1d23" text-anchor="start">GSHの合成</text><text x="350" y="590" font-size="24" fill="#1c1d23" text-anchor="start">NADPHの維持</text><text x="680" y="590" font-size="24" fill="#1c1d23" text-anchor="start">異物処理など</text><text x="65" y="620" font-size="20" fill="#1c1d23" text-anchor="start">これらに関わる酵素の産生を高める</text><text x="40" y="699" font-size="24" fill="#1c1d23" text-anchor="start">ROSに対処するための「処理能力」を上げる応答です。</text><text x="40" y="742" font-size="19" fill="#1c1d23" text-anchor="start">通常はKEAP1がNrf2の分解を促します。</text></svg>