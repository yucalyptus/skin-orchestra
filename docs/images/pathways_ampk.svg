<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title"><title id="title">AMPK｜エネルギーの産生と消費を調節</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1d4f91"/></marker></defs><rect width="760" height="650" fill="white"/><g font-family="Hiragino Sans, Noto Sans JP, sans-serif" fill="#1c1d23">
<text x="30" y="40" text-anchor="start" font-size="25" fill="#1c1d23" font-weight="600">AMPK｜エネルギーの産生と消費を調節</text>
<rect x="20" y="75" width="720" height="520" rx="18" fill="#f2f4f7" stroke="#c5cdd6" stroke-width="2"/>
<text x="44" y="107" text-anchor="start" font-size="18" fill="#64748b" font-weight="400">細胞内</text>
<text x="380" y="149" text-anchor="middle" font-size="23" fill="#1c1d23" font-weight="400">ATPに対してAMP・ADPが相対的に増加</text>
<path d="M380 171 L380 219" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<rect x="285.0" y="222.0" width="190" height="54" rx="14" fill="white" stroke="#1d4f91" stroke-width="2"/>
<text x="380" y="256" text-anchor="middle" font-size="21" fill="#1c1d23" font-weight="400">AMPK</text>
<path d="M380 278 L155 342" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<rect x="50.0" y="343.0" width="210" height="54" rx="14" fill="white" stroke="#1d4f91" stroke-width="2"/>
<text x="155" y="377" text-anchor="middle" font-size="21" fill="#1c1d23" font-weight="400">ATP産生を促進</text>
<text x="155" y="425" text-anchor="middle" font-size="18" fill="#1c1d23" font-weight="400">糖・脂肪酸の利用</text>
<path d="M380 278 L395 342" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<rect x="290.0" y="343.0" width="210" height="54" rx="14" fill="white" stroke="#1d4f91" stroke-width="2"/>
<text x="395" y="377" text-anchor="middle" font-size="21" fill="#1c1d23" font-weight="400">合成を抑制</text>
<text x="395" y="425" text-anchor="middle" font-size="18" fill="#1c1d23" font-weight="400">脂質合成など</text>
<path d="M380 278 L625 342" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<rect x="520.0" y="343.0" width="210" height="54" rx="14" fill="white" stroke="#1d4f91" stroke-width="2"/>
<text x="625" y="377" text-anchor="middle" font-size="21" fill="#1c1d23" font-weight="400">更新を調節</text>
<text x="625" y="425" text-anchor="middle" font-size="18" fill="#1c1d23" font-weight="400">ULK1などへ作用</text>
<text x="380" y="510" text-anchor="middle" font-size="21" fill="#1c1d23" font-weight="400">mTORC1の抑制とULK1への作用を介し、</text>
<text x="380" y="544" text-anchor="middle" font-size="21" fill="#1c1d23" font-weight="400">オートファジーの開始にも関わる</text>
<text x="30" y="632" text-anchor="start" font-size="16" fill="#64748b" font-weight="400">矢印：代表的な信号の流れ。途中の分子・分岐は一部省略。</text>
</g></svg>