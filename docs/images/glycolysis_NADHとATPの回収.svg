<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="title"><title id="title">NADHを作る反応と、ATPを作る反応</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#555b63" stroke-width="1.6"/></marker></defs><rect width="760" height="650" fill="white"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif"><text x="32" y="44" font-size="28" font-weight="700" fill="#202124" text-anchor="start">NADHを作る反応と、ATPを作る反応</text><text x="380" y="107" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">2 GAP</text><text x="380" y="137" font-size="20" font-weight="400" fill="#555b63" text-anchor="middle">glyceraldehyde-3-phosphate</text><line x1="380" y1="153" x2="380" y2="218" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="407" y="192.5" font-size="20" font-weight="400" fill="#245b91" text-anchor="start">GAPDH</text><text x="38" y="195" font-size="24" font-weight="700" fill="#245b91" text-anchor="start">2 NAD⁺ → 2 NADH</text><text x="380" y="266" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">2 1,3-bisphosphoglycerate</text><text x="380" y="296" font-size="20" font-weight="400" fill="#555b63" text-anchor="middle">電子を取り出し、無機リン酸を取り込む</text><line x1="380" y1="315" x2="380" y2="381" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="407" y="355.0" font-size="20" font-weight="400" fill="#245b91" text-anchor="start">PGK</text><text x="38" y="357" font-size="24" font-weight="700" fill="#245b91" text-anchor="start">2 ADP → 2 ATP</text><text x="380" y="430" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">2 3-phosphoglycerate</text><text x="380" y="460" font-size="20" font-weight="400" fill="#555b63" text-anchor="middle">リン酸をADPへ渡す</text><line x1="32" y1="484" x2="728" y2="484" stroke="#cdd2d8" stroke-width="2"/><text x="40" y="529" font-size="20" font-weight="400" fill="#555b63" text-anchor="start">GAPDH：glyceraldehyde-3-phosphate dehydrogenase</text><text x="40" y="563" font-size="20" font-weight="400" fill="#555b63" text-anchor="start">PGK：phosphoglycerate kinase</text><text x="40" y="605" font-size="20" font-weight="400" fill="#555b63" text-anchor="start">glucose 1分子分の収支。Pi・H⁺などは省略。</text></g></svg>