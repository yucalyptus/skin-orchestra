<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" role="img" aria-labelledby="title"><title id="title">解糖系の3つの調節点は、経路の中にある</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#555b63" stroke-width="1.6"/></marker></defs><rect width="760" height="1000" fill="white"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif"><text x="32" y="44" font-size="28" font-weight="700" fill="#202124" text-anchor="start">解糖系の3つの調節点は、経路の中にある</text><text x="171" y="125" font-size="25" font-weight="700" fill="#202124" text-anchor="middle">glucose</text><line x1="171" y1="149" x2="171" y2="246" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="171" y="285" font-size="25" font-weight="700" fill="#202124" text-anchor="middle">G6P</text><line x1="171" y1="309" x2="171" y2="366" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="171" y="405" font-size="25" font-weight="700" fill="#202124" text-anchor="middle">fructose-6-P</text><line x1="171" y1="429" x2="171" y2="526" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="171" y="565" font-size="25" font-weight="700" fill="#202124" text-anchor="middle">fructose-1,6-bisP</text><line x1="171" y1="589" x2="171" y2="681" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="171" y="720" font-size="25" font-weight="700" fill="#202124" text-anchor="middle">PEP</text><line x1="171" y1="744" x2="171" y2="841" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="171" y="880" font-size="25" font-weight="700" fill="#202124" text-anchor="middle">pyruvate</text><line x1="210" y1="205" x2="335" y2="205" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="181" font-size="25" font-weight="700" fill="#202124" text-anchor="start">1　hexokinase</text><text x="360" y="223" font-size="23" font-weight="700" fill="#245b91" text-anchor="start">ATP → ADP</text><text x="360" y="260" font-size="21" font-weight="400" fill="#555b63" text-anchor="start">糖を細胞内の代謝へ渡す</text><line x1="210" y1="485" x2="335" y2="485" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="461" font-size="25" font-weight="700" fill="#202124" text-anchor="start">2　PFK-1</text><text x="360" y="503" font-size="23" font-weight="700" fill="#245b91" text-anchor="start">ATP → ADP</text><text x="360" y="540" font-size="21" font-weight="400" fill="#555b63" text-anchor="start">エネルギー状態に応じて調節</text><line x1="210" y1="800" x2="335" y2="800" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="776" font-size="25" font-weight="700" fill="#202124" text-anchor="start">3　pyruvate kinase</text><text x="360" y="818" font-size="23" font-weight="700" fill="#245b91" text-anchor="start">ADP → ATP</text><text x="360" y="855" font-size="21" font-weight="400" fill="#555b63" text-anchor="start">最後の反応でATPを作る</text><text x="380" y="945" font-size="20" font-weight="400" fill="#555b63" text-anchor="middle">実線：この3反応　破線：間の複数の反応を省略</text><text x="380" y="979" font-size="20" font-weight="400" fill="#555b63" text-anchor="middle">G6P＝glucose-6-phosphate、PEP＝phosphoenolpyruvate</text></g></svg>