<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc"><title id="title">絶食時、肝でケトン体が増える理由</title><desc id="desc">脂肪酸からのacetyl-CoA供給が増える一方、オキサロ酢酸は糖新生にも使われる。TCA回路で利用するには両者の結合が必要。acetyl-CoAからHMG-CoAを経てケトン体を作る経路が進む。</desc><defs><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6b7280"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245da8"/></marker></defs><rect width="1000" height="810" fill="white"/><g font-family="system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif" fill="#202124"><text x="36" y="47" font-size="32" font-weight="700" fill="#202124" text-anchor="start">絶食時、肝でケトン体が増える理由</text><text x="36" y="84" font-size="22" font-weight="400" fill="#606773" text-anchor="start">肝細胞内の流れ（反応の一部を省略）</text><text x="245" y="140" font-size="27" font-weight="700" fill="#202124" text-anchor="middle">① 脂肪酸の供給が増える</text><path d="M245 158V222" fill="none" stroke="#245da8" stroke-width="5" marker-end="url(#blue)"/><text x="345" y="193" font-size="24" font-weight="400" fill="#202124" text-anchor="middle">β酸化</text><text x="245" y="263" font-size="37" font-weight="700" fill="#202124" text-anchor="middle">acetyl-CoA</text><text x="245" y="297" font-size="25" font-weight="700" fill="#245da8" text-anchor="middle">アセチルCoAが増える</text><text x="755" y="142" font-size="26" font-weight="700" fill="#202124" text-anchor="middle">glucose（血糖を保つ）</text><path d="M755 225V161" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#gray)"/><text x="860" y="196" font-size="24" font-weight="400" fill="#202124" text-anchor="middle">糖新生</text><text x="755" y="266" font-size="33" font-weight="700" fill="#202124" text-anchor="middle">oxaloacetate</text><text x="755" y="301" font-size="24" font-weight="400" fill="#202124" text-anchor="middle">オキサロ酢酸</text><text x="755" y="342" font-size="26" font-weight="700" fill="#202124" text-anchor="middle">② 糖新生にも使われる</text><path d="M377 267H465V390" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#gray)"/><path d="M613 267H535V390" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#gray)"/><text x="500" y="428" font-size="29" font-weight="700" fill="#202124" text-anchor="middle">citrate</text><text x="500" y="459" font-size="23" font-weight="400" fill="#202124" text-anchor="middle">クエン酸</text><path d="M500 470V493" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#gray)"/><path d="M500 505 A65 65 0 1 1 441 541" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#gray)"/><text x="500" y="571" font-size="24" font-weight="700" fill="#202124" text-anchor="middle">TCA</text><text x="696" y="526" font-size="23" font-weight="400" fill="#202124" text-anchor="middle">ここに入るには</text><text x="696" y="558" font-size="25" font-weight="700" fill="#202124" text-anchor="middle">両者の結合が必要</text><text x="696" y="596" font-size="23" font-weight="400" fill="#202124" text-anchor="middle">増えたacetyl-CoAを</text><text x="696" y="627" font-size="23" font-weight="400" fill="#202124" text-anchor="middle">すべては使いきれない</text><path d="M245 319V458" fill="none" stroke="#245da8" stroke-width="6" marker-end="url(#blue)"/><text x="245" y="499" font-size="32" font-weight="700" fill="#245da8" text-anchor="middle">HMG-CoA</text><text x="245" y="534" font-size="23" font-weight="400" fill="#202124" text-anchor="middle">合成途中の中間体</text><path d="M245 553V598" fill="none" stroke="#245da8" stroke-width="6" marker-end="url(#blue)"/><text x="245" y="644" font-size="36" font-weight="700" fill="#245da8" text-anchor="middle">ケトン体</text><text x="245" y="682" font-size="26" font-weight="700" fill="#245da8" text-anchor="middle">③ 合成が増える</text><path d="M36 709H964" stroke="#d5d9df" stroke-width="1.5"/><text x="36" y="745" font-size="24" font-weight="400" fill="#202124" text-anchor="start">青い経路：acetyl-CoAからHMG-CoAを経てケトン体を作る。</text><text x="36" y="782" font-size="21" font-weight="400" fill="#606773" text-anchor="start">TCA回路は続きます。矢印の太さは反応量の実測値ではありません。</text></g></svg>