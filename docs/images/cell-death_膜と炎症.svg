<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img"><title>apoptosisとnecrosisの膜の違い</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#1d4f91"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif} </style><rect width="1000" height="720" fill="white"/><text x="40" y="52" font-size="32" fill="#1c1d23" text-anchor="start">細胞膜が保たれるか、中身が漏れるか</text><text x="40" y="98" font-size="28" fill="#1c1d23" text-anchor="start">apoptosis</text><circle cx="110" cy="189" r="40" fill="#f2f4f7" stroke="#64748b" stroke-width="3"/><circle cx="110" cy="189" r="13.333333333333334" fill="#64748b"/><path d="M170 189 L270 189" stroke="#1d4f91" fill="none" stroke-width="3" marker-end="url(#a)"/><circle cx="315" cy="189" r="25" fill="#f2f4f7" stroke="#64748b" stroke-width="3"/><circle cx="315" cy="189" r="8.333333333333334" fill="#64748b"/><circle cx="366" cy="164" r="14" fill="#f2f4f7" stroke="#64748b" stroke-width="3"/><circle cx="366" cy="164" r="4.666666666666667" fill="#64748b"/><circle cx="366" cy="208" r="14" fill="#f2f4f7" stroke="#64748b" stroke-width="3"/><circle cx="366" cy="208" r="4.666666666666667" fill="#64748b"/><path d="M400 189 L510 189" stroke="#1d4f91" fill="none" stroke-width="3" marker-end="url(#a)"/><ellipse cx="648" cy="190" rx="82" ry="67" fill="#f2f4f7" stroke="#64748b" stroke-width="3"/><circle cx="641" cy="190" r="24" fill="#f2f4f7" stroke="#64748b" stroke-width="3"/><circle cx="641" cy="190" r="8.0" fill="#64748b"/><text x="65" y="281" font-size="22" fill="#1c1d23" text-anchor="start">膜を保って縮小</text><text x="284" y="281" font-size="22" fill="#1c1d23" text-anchor="start">小体へ分かれる</text><text x="559" y="281" font-size="22" fill="#1c1d23" text-anchor="start">周囲の細胞が取り込む</text><text x="45" y="333" font-size="25" fill="#1c1d23" text-anchor="start">中身の漏出を抑え、炎症を起こしにくい</text><path d="M40 365 H950" stroke="#f2f4f7"/><text x="40" y="413" font-size="28" fill="#1c1d23" text-anchor="start">necrosis</text><circle cx="110" cy="503" r="42" fill="#f2f4f7" stroke="#64748b" stroke-width="3"/><circle cx="110" cy="503" r="14.0" fill="#64748b"/><path d="M170 503 L270 503" stroke="#1d4f91" fill="none" stroke-width="3" marker-end="url(#a)"/><path d="M276 503 A53 53 0 1 1 366.1 540.1" fill="#fbf2f0" stroke="#a34b40" stroke-width="4"/><circle cx="354" cy="539" r="6" fill="#a34b40"/><circle cx="378" cy="563" r="6" fill="#a34b40"/><circle cx="401" cy="537" r="6" fill="#a34b40"/><circle cx="401" cy="575" r="6" fill="#a34b40"/><path d="M432 503 L527 503" stroke="#1d4f91" fill="none" stroke-width="3" marker-end="url(#a)"/><text x="560" y="483" font-size="25" fill="#1c1d23" text-anchor="start">細胞外へDAMPsが出る</text><text x="560" y="528" font-size="25" fill="#1c1d23" text-anchor="start">炎症細胞が反応する</text><text x="63" y="613" font-size="25" fill="#a34b40" text-anchor="start">膜が破綻し、周囲に損傷を知らせる信号が広がる</text><text x="40" y="676" font-size="18" fill="#1c1d23" text-anchor="start">炎症の程度は、死ぬ細胞の量や除去の速さ、周囲の細胞の状態でも変わります。</text></svg>