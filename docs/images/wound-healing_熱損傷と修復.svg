<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img"><title>限局した熱損傷と広範な熱損傷</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#1d4f91"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif} </style><rect width="1000" height="780" fill="white"/><text x="40" y="55" font-size="32" fill="#1c1d23" text-anchor="start">熱損傷のあと、修復する組織が残るか</text><text x="40" y="98" font-size="20" fill="#1c1d23" text-anchor="start">皮膚の断面を模式的に比較。温度・出力の閾値を示す図ではありません。</text><text x="40" y="153" font-size="28" fill="#1c1d23" text-anchor="start">限局した損傷</text><rect x="40" y="181" width="425" height="248" rx="18" fill="#f2f4f7"/><path d="M40 223 H465" stroke="#64748b" stroke-width="4"/><text x="52" y="207" font-size="17" fill="#1c1d23" text-anchor="start">表皮</text><text x="52" y="254" font-size="17" fill="#1c1d23" text-anchor="start">真皮</text><path d="M139 184 h45 v142 q-22 30 -45 0Z" fill="#a34b40" opacity=".75"/><path d="M292 184 h45 v142 q-22 30 -45 0Z" fill="#a34b40" opacity=".75"/><path d="M90 383 q35 -30 52 0" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="0"/><path d="M225 383 q35 -30 52 0" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="0"/><path d="M393 383 q35 -30 52 0" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="0"/><text x="40" y="468" font-size="24" fill="#1c1d23" text-anchor="start">修復する細胞・血流が残る</text><path d="M249 490 L249 542" stroke="#1d4f91" fill="none" stroke-width="3" marker-end="url(#a)"/><text x="40" y="584" font-size="24" fill="#1c1d23" text-anchor="start">残存組織からの治癒・再構築</text><text x="40" y="623" font-size="24" fill="#1c1d23" text-anchor="start">を利用する治療がある</text><text x="535" y="153" font-size="28" fill="#1c1d23" text-anchor="start">広く深い損傷</text><rect x="535" y="181" width="425" height="248" rx="18" fill="#f2f4f7"/><path d="M535 223 H960" stroke="#64748b" stroke-width="4"/><text x="547" y="207" font-size="17" fill="#1c1d23" text-anchor="start">表皮</text><text x="547" y="254" font-size="17" fill="#1c1d23" text-anchor="start">真皮</text><path d="M613 184 H924 V398 Q800 438 613 398Z" fill="#a34b40" opacity=".75"/><path d="M585 383 q35 -30 52 0" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="4 5"/><path d="M720 383 q35 -30 52 0" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="4 5"/><path d="M888 383 q35 -30 52 0" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="4 5"/><text x="535" y="468" font-size="24" fill="#1c1d23" text-anchor="start">修復する細胞・血流も傷つく</text><path d="M744 490 L744 542" stroke="#1d4f91" fill="none" stroke-width="3" marker-end="url(#a)"/><text x="535" y="584" font-size="24" fill="#1c1d23" text-anchor="start">治癒の遅れ・炎症の持続</text><text x="535" y="623" font-size="24" fill="#1c1d23" text-anchor="start">瘢痕のリスクが高まる</text><text x="40" y="692" font-size="18" fill="#1c1d23" text-anchor="start">赤：損傷部　　薄茶：周囲の組織　　下部の線：血管の模式図</text><text x="40" y="739" font-size="22" fill="#1c1d23" text-anchor="start">壊死の有無だけでなく、損傷の範囲と残る修復能力を見ることが大切です。</text></svg>