<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img"><title>紫外線・可視光線・赤外線は、波長で分かれる</title><rect width="900" height="440" fill="white"/><g font-family="sans-serif"><text x="36" y="44" font-size="28" fill="#1d4f91" text-anchor="start">紫外線・可視光線・赤外線は、波長で分かれる</text><text x="40" y="96" font-size="22" fill="#1c1d23" text-anchor="start">短い波長</text><text x="860" y="96" font-size="22" fill="#1c1d23" text-anchor="end">長い波長 →</text><rect x="40" y="120" width="170" height="64" fill="#f2f4f7"/><rect x="210" y="120" width="340" height="64" fill="url(#spectrum)"/><rect x="550" y="120" width="310" height="64" fill="#f2f4f7"/><defs><linearGradient id="spectrum"><stop offset="0" stop-color="#8463aa"/><stop offset=".2" stop-color="#5284be"/><stop offset=".45" stop-color="#70a77b"/><stop offset=".65" stop-color="#e2c965"/><stop offset="1" stop-color="#ba6356"/></linearGradient></defs><text x="125" y="223" font-size="26" fill="#1c1d23" text-anchor="middle">紫外線</text><text x="380" y="223" font-size="26" fill="#1c1d23" text-anchor="middle">可視光線</text><text x="705" y="223" font-size="26" fill="#1c1d23" text-anchor="middle">赤外線</text><text x="380" y="258" font-size="22" fill="#1c1d23" text-anchor="middle">およそ400〜700 nm</text><text x="125" y="258" font-size="20" fill="#1c1d23" text-anchor="middle">目には見えない</text><text x="705" y="258" font-size="20" fill="#1c1d23" text-anchor="middle">目には見えない</text><text x="40" y="313" font-size="22" fill="#1d4f91" text-anchor="start">治療波長の例</text><text x="250" y="313" font-size="24" fill="#1c1d23" text-anchor="start">532・595・694 nm</text><text x="565" y="313" font-size="24" fill="#1c1d23" text-anchor="start">1064・1550 nm</text><text x="565" y="350" font-size="24" fill="#1c1d23" text-anchor="start">2940・10600 nm</text><text x="40" y="402" font-size="20" fill="#1c1d23" text-anchor="start">分類を示す模式図。境界は概略で、横軸は比例尺ではありません。</text></g></svg>