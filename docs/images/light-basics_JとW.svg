<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img"><title>Jは量、Wは速さ、J/cm²は面積あたりの量</title><rect width="900" height="480" fill="white"/><g font-family="sans-serif"><text x="36" y="44" font-size="28" fill="#1d4f91" text-anchor="start">Jは量、Wは速さ、J/cm²は面積あたりの量</text><text x="45" y="98" font-size="24" fill="#1d4f91" text-anchor="start">同じ6 Jを、異なる時間で与える</text><path d="M65,240 L420,240" stroke="#64748b" stroke-width="2" fill="none"/><path d="M65,240 L65,115" stroke="#64748b" stroke-width="2" fill="none"/><rect x="85" y="180" width="240" height="60" fill="#dce7f5"/><text x="105" y="172" font-size="24" fill="#1c1d23" text-anchor="start">2 W × 3秒</text><path d="M490,240 L845,240" stroke="#64748b" stroke-width="2" fill="none"/><path d="M490,240 L490,115" stroke="#64748b" stroke-width="2" fill="none"/><rect x="510" y="120" width="120" height="120" fill="#dce7f5"/><text x="655" y="164" font-size="24" fill="#1c1d23" text-anchor="start">4 W</text><text x="655" y="198" font-size="24" fill="#1c1d23" text-anchor="start">× 1.5秒</text><text x="45" y="280" font-size="22" fill="#1c1d23" text-anchor="start">一定出力の例：長方形の面積がエネルギー（6 J）</text><path d="M40,308 L860,308" stroke="#c5cdd6" stroke-width="2" fill="none"/><text x="45" y="350" font-size="24" fill="#1d4f91" text-anchor="start">同じ6 Jを、異なる面積に照射する</text><circle cx="150" cy="412" r="30" fill="#dce7f5"/><text x="210" y="419" font-size="24" fill="#1c1d23" text-anchor="start">1 cm² → 6 J/cm²</text><circle cx="560" cy="412" r="42.43" fill="#dce7f5"/><text x="620" y="419" font-size="24" fill="#1c1d23" text-anchor="start">2 cm²</text><text x="620" y="453" font-size="24" fill="#1c1d23" text-anchor="start">→ 3 J/cm²</text></g></svg>