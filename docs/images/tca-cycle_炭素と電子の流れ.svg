<text x="280" y="633" font-size="16" font-weight="700" text-anchor="middle" fill="#1E3A63">1周で 3 NADH ・1 FADH₂ ・1 GTP ・2 CO₂</text>

<text x="44" y="681" font-size="14.5" fill="#111827"><tspan font-weight="700">直接得るのは GTP 1個相当。</tspan>主産物は</text>
<text x="44" y="707" font-size="14.5" fill="#111827"><tspan font-weight="700" fill="#245b91">NADH と FADH₂</tspan> で、ATP はこの電子から電子伝達系で作られる。</text>
