<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 736" style="display:block;width:100%;max-width:560px;margin:0 auto;height:auto;background:#fff" role="img" aria-label="TCA回路。8つの中間体を同じ円周上に配置し、同じ半径の円弧矢印で一周を示す。oxaloacetateにacetyl-CoAが加わってcitrateとなり、isocitrate、alpha-ketoglutarate、succinyl-CoA、succinate、fumarate、malateを経てoxaloacetateに戻る。1周で3 NADH、1 FADH2、1 GTP、2 CO2ができる">
<defs>
<marker id="tcaMainArrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#2F5C87"/></marker>
<marker id="tcaEntryArrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#245b91"/></marker>
</defs>
<rect x="3" y="3" width="554" height="730" rx="12" fill="#FFFFFF" stroke="#8A97AC" stroke-width="1.8"/>
<g font-family="system-ui,-apple-system,sans-serif">
<text x="28" y="42" font-size="21" font-weight="700" fill="#1E3A63">回るあいだに、炭素を捨てて電子を取り出す</text>
<text x="28" y="69" font-size="14" fill="#3B4A63">回路の矢印は反応の流れ。各反応で生じる分子を併記</text>

<text x="447" y="91" font-size="12.5" text-anchor="middle" fill="#3B4A63">糖からも脂肪酸からも入る</text>
<rect x="365" y="99" width="168" height="42" rx="9" fill="#f4f6f8" stroke="#245b91" stroke-width="1.7"/>
<text x="449" y="126" font-size="15.5" font-weight="700" text-anchor="middle" fill="#202124">acetyl-CoA</text>
<path d="M414 143 Q403 174 380 210" fill="none" stroke="#245b91" stroke-width="3" marker-end="url(#tcaEntryArrow)"/>

