<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" role="img" aria-labelledby="title"><title id="title">糖の炭素は、ATP産生と合成へ分かれる</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#555b63" stroke-width="1.6"/></marker></defs><rect width="760" height="680" fill="white"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif"><text x="32" y="44" font-size="28" font-weight="700" fill="#202124" text-anchor="start">糖の炭素は、ATP産生と合成へ分かれる</text><text x="240" y="112" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">glucose</text><line x1="240" y1="130" x2="240" y2="174" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="214" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">G6P</text><text x="240" y="245" font-size="20" font-weight="400" fill="#555b63" text-anchor="middle">glucose-6-phosphate</text><line x1="315" y1="203" x2="462" y2="203" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="395" y="183" font-size="22" font-weight="700" fill="#245b91" text-anchor="middle">PPPへ</text><text x="493" y="210" font-size="27" font-weight="700" fill="#202124" text-anchor="start">NADPH</text><text x="493" y="244" font-size="20" font-weight="400" fill="#555b63" text-anchor="start">合成・抗酸化の還元力</text><text x="493" y="291" font-size="26" font-weight="700" fill="#202124" text-anchor="start">ribose-5-P</text><text x="493" y="324" font-size="20" font-weight="400" fill="#555b63" text-anchor="start">核酸の材料</text><line x1="240" y1="271" x2="240" y2="373" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="263" y="321" font-size="22" font-weight="400" fill="#245b91" text-anchor="start">解糖系</text><text x="240" y="412" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">pyruvate</text><path d="M240 435 V472 H134 V510" fill="none" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><path d="M240 435 V472 H521 V510" fill="none" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="134" y="551" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">lactate</text><text x="134" y="587" font-size="22" font-weight="400" fill="#245b91" text-anchor="middle">NAD⁺を再生</text><text x="521" y="551" font-size="28" font-weight="700" fill="#202124" text-anchor="middle">ミトコンドリア</text><text x="521" y="587" font-size="22" font-weight="400" fill="#245b91" text-anchor="middle">TCA回路・電子伝達系へ</text><line x1="32" y1="617" x2="728" y2="617" stroke="#cdd2d8" stroke-width="2"/><text x="380" y="655" font-size="20" font-weight="400" fill="#555b63" text-anchor="middle">主な行き先の概略。炭素は複数の経路へ同時に流れる。</text></g></svg>