<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="Hiragino Sans, Noto Sans JP, sans-serif"><rect width="1440" height="900" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c1d23"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a34b40"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4f91"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="20" y="20" width="1400" height="360" rx="14" fill="none" stroke="#1d4f91" stroke-width="2.5"/>
<text x="40" y="58" text-anchor="start" font-size="21" font-weight="700" fill="#1d4f91">活性中心：酵素の表面にある、反応が起きるくぼみ</text>
<path d="M 110,280 C 98,178 156,124 216,130 L 220,196 Q 260,232 300,196 L 304,130 C 364,124 422,178 410,280 C 406,344 322,364 260,362 C 198,364 114,344 110,280 Z" fill="#e8eef6" stroke="#1d4f91" stroke-width="2.5"/>
<circle cx="243" cy="210" r="13" fill="#64748b"/>
<text x="243" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Cu</text>
<circle cx="277" cy="210" r="13" fill="#64748b"/>
<text x="277" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Cu</text>
<text x="260" y="318.0" text-anchor="middle" font-size="19.0" font-weight="700" fill="#1d4f91">チロシナーゼ</text>
<polygon points="260.0,131.0 278.2,141.5 278.2,162.5 260.0,173.0 241.8,162.5 241.8,141.5" fill="none" stroke="#64748b" stroke-width="2.5"/>
<circle cx="260" cy="152" r="11.8" fill="none" stroke="#64748b" stroke-width="1.8"/>
<line x1="260" y1="173" x2="260" y2="189" stroke="#64748b" stroke-width="2.5"/>
<text x="270" y="191" text-anchor="start" font-size="14" font-weight="700" fill="#64748b">OH</text>
<line x1="260" y1="131" x2="260" y2="113" stroke="#64748b" stroke-width="2.5"/>
<text x="260" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">R</text>
<line x1="292" y1="218" x2="428" y2="304" stroke="#64748b" stroke-width="1.5"/>
<text x="436" y="310" text-anchor="start" font-size="16" font-weight="400" fill="#64748b">銅2個</text>
<line x1="200" y1="144" x2="110" y2="120" stroke="#64748b" stroke-width="1.5"/>
<text x="108" y="116" text-anchor="end" font-size="16" font-weight="400" fill="#64748b">くぼみの口</text>
<text x="560" y="130" text-anchor="start" font-size="17" font-weight="400" fill="#1c1d23">酵素はタンパク質全体で反応するのではなく、表面の小さなくぼみだけが反応の場です。</text>
<text x="560" y="160" text-anchor="start" font-size="17" font-weight="400" fill="#1c1d23">チロシナーゼでは、くぼみの底に銅が2個あり、そこに酸素が結合します。</text>
<text x="560" y="190" text-anchor="start" font-size="17" font-weight="400" fill="#1c1d23">チロシンはこのくぼみにはまり、フェノール環が銅と酸素のすぐそばに置かれます。</text>
<line x1="560" y1="248" x2="1390" y2="248" stroke="#c5cdd6" stroke-width="1.5"/>
<text x="560" y="284" text-anchor="start" font-size="17" font-weight="400" fill="#1c1d23">くぼみは形が決まっていて、はまる分子と、はまらない分子があります。くぼみは1つなので、</text>
<text x="560" y="314" text-anchor="start" font-size="17" font-weight="400" fill="#1c1d23">別の分子が入っている間、チロシンは入れません。美白成分の多くはチロシンと似た形を持ち、</text>
<text x="560" y="344" text-anchor="start" font-size="17" font-weight="400" fill="#1c1d23">このくぼみにはまります。</text>
<text x="40" y="430" text-anchor="start" font-size="21" font-weight="700" fill="#1c1d23">くぼみに入った後、2つに分かれる</text>
<rect x="20" y="450" width="690" height="430" rx="14" fill="none" stroke="#a34b40" stroke-width="2.5"/>
<text x="44" y="488" text-anchor="start" font-size="19" font-weight="700" fill="#a34b40">酸化されて、キノンになって出ていく</text>
<text x="44" y="516" text-anchor="start" font-size="16" font-weight="400" fill="#64748b">ハイドロキノン・ロドデノール</text>
<path d="M 82,679 C 73,605 115,566 158,571 L 161,618 Q 190,644 219,618 L 222,571 C 265,566 307,605 298,679 C 295,725 235,739 190,738 C 145,739 85,725 82,679 Z" fill="#e8eef6" stroke="#1d4f91" stroke-width="1.8"/>
<circle cx="178" cy="628" r="9" fill="#64748b"/>
<text x="178" y="632" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Cu</text>
<circle cx="202" cy="628" r="9" fill="#64748b"/>
<text x="202" y="632" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Cu</text>
<polygon points="190.0,570.0 203.9,578.0 203.9,594.0 190.0,602.0 176.1,594.0 176.1,578.0" fill="none" stroke="#a34b40" stroke-width="2.5"/>
<circle cx="190" cy="586" r="9.0" fill="none" stroke="#a34b40" stroke-width="1.8"/>
<line x1="190" y1="602" x2="190" y2="618" stroke="#a34b40" stroke-width="2.5"/>
<text x="200" y="620" text-anchor="start" font-size="14" font-weight="700" fill="#a34b40">OH</text>
<line x1="300" y1="650" x2="420" y2="650" stroke="#a34b40" stroke-width="3" marker-end="url(#r)"/>
<text x="360" y="630" text-anchor="middle" font-size="16" font-weight="400" fill="#a34b40">酸化</text>
<polygon points="500.0,604.0 522.5,617.0 522.5,643.0 500.0,656.0 477.5,643.0 477.5,617.0" fill="#fbf2f0" stroke="#a34b40" stroke-width="2.5"/>
<line x1="522.5" y1="617.0" x2="532.9" y2="611.0" stroke="#a34b40" stroke-width="2.5"/>
<circle cx="537.2" cy="608.5" r="5" fill="#a34b40"/>
<line x1="500.0" y1="656.0" x2="500.0" y2="668.0" stroke="#a34b40" stroke-width="2.5"/>
<circle cx="500.0" cy="673.0" r="5" fill="#a34b40"/>
<text x="500" y="700" text-anchor="middle" font-size="18" font-weight="700" fill="#a34b40">キノン</text>
<text x="44" y="790" text-anchor="start" font-size="16" font-weight="400" fill="#1c1d23">キノンは細胞のタンパク質に結合し、メラノサイトを傷つけます。</text>
<text x="44" y="816" text-anchor="start" font-size="16" font-weight="400" fill="#1c1d23">酵素から出ていくので、次の分子がまた入ります。</text>
<rect x="730" y="450" width="690" height="430" rx="14" fill="none" stroke="#1d4f91" stroke-width="2.5"/>
<text x="754" y="488" text-anchor="start" font-size="19" font-weight="700" fill="#1d4f91">酸化されず、くぼみに居座る</text>
<text x="754" y="516" text-anchor="start" font-size="16" font-weight="400" fill="#64748b">4-n-ブチルレゾルシノール・チアミドール</text>
<path d="M 792,679 C 783,605 825,566 868,571 L 871,618 Q 900,644 929,618 L 932,571 C 975,566 1017,605 1008,679 C 1005,725 945,739 900,738 C 855,739 795,725 792,679 Z" fill="#e8eef6" stroke="#1d4f91" stroke-width="1.8"/>
<circle cx="888" cy="628" r="9" fill="#64748b"/>
<text x="888" y="632" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Cu</text>
<circle cx="912" cy="628" r="9" fill="#64748b"/>
<text x="912" y="632" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Cu</text>
<polygon points="900.0,570.0 913.9,578.0 913.9,594.0 900.0,602.0 886.1,594.0 886.1,578.0" fill="none" stroke="#1d4f91" stroke-width="2.5"/>
<circle cx="900" cy="586" r="9.0" fill="none" stroke="#1d4f91" stroke-width="1.8"/>
<line x1="900" y1="602" x2="900" y2="618" stroke="#1d4f91" stroke-width="2.5"/>
<text x="910" y="620" text-anchor="start" font-size="14" font-weight="700" fill="#1d4f91">OH</text>
<polygon points="1215.0,580.0 1232.3,590.0 1232.3,610.0 1215.0,620.0 1197.7,610.0 1197.7,590.0" fill="none" stroke="#64748b" stroke-width="2.5"/>
<circle cx="1215" cy="600" r="11.2" fill="none" stroke="#64748b" stroke-width="1.8"/>
<line x1="1215" y1="620" x2="1215" y2="636" stroke="#64748b" stroke-width="2.5"/>
<text x="1217" y="654" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">OH</text>
<text x="1215" y="548" text-anchor="middle" font-size="16" font-weight="700" fill="#64748b">チロシン</text>
<path d="M1078,580 L1122,620 M1122,580 L1078,620" stroke="#a34b40" stroke-width="5" stroke-linecap="round"/>
<text x="1100" y="664" text-anchor="middle" font-size="16" font-weight="700" fill="#a34b40">入れない</text>
<text x="754" y="790" text-anchor="start" font-size="16" font-weight="400" fill="#1c1d23">チロシンが入れないので、メラニンの合成が減ります。</text>
<text x="754" y="816" text-anchor="start" font-size="16" font-weight="400" fill="#1c1d23">やめて濃度が下がると出ていき、酵素の働きは戻ります。</text></svg>