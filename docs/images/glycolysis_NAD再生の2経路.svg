<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" role="img" aria-labelledby="title"><title id="title">細胞質のNADHから、NAD⁺を再生する</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#555b63" stroke-width="1.6"/></marker></defs><rect width="760" height="720" fill="white"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif"><text x="32" y="44" font-size="28" font-weight="700" fill="#202124" text-anchor="start">細胞質のNADHから、NAD⁺を再生する</text><rect x="24" y="81" width="712" height="46" fill="#f4f6f8"/><text x="40" y="112" font-size="24" font-weight="700" fill="#202124" text-anchor="start">1　shuttleで電子をミトコンドリアへ渡す</text><text x="168" y="177" font-size="22" font-weight="700" fill="#202124" text-anchor="start">細胞質</text><text x="510" y="177" font-size="22" font-weight="700" fill="#202124" text-anchor="start">ミトコンドリア</text><line x1="383" y1="148" x2="383" y2="354" stroke="#cdd2d8" stroke-width="2" stroke-dasharray="7 6"/><text x="163" y="230" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">NADH</text><line x1="163" y1="249" x2="163" y2="291" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="163" y="331" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">NAD⁺</text><line x1="220" y1="248" x2="491" y2="248" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="350" y="226" font-size="22" font-weight="400" fill="#245b91" text-anchor="middle">電子を渡す</text><text x="587" y="270" font-size="26" font-weight="700" fill="#202124" text-anchor="middle">電子伝達系</text><text x="587" y="311" font-size="22" font-weight="400" fill="#555b63" text-anchor="middle">最後はO₂へ</text><text x="40" y="386" font-size="22" font-weight="400" fill="#202124" text-anchor="start">NADH分子そのものが内膜を通るわけではない。</text><rect x="24" y="425" width="712" height="46" fill="#f4f6f8"/><text x="40" y="456" font-size="24" font-weight="700" fill="#202124" text-anchor="start">2　LDHで電子をpyruvateへ渡す</text><text x="40" y="522" font-size="28" font-weight="700" fill="#202124" text-anchor="start">pyruvate ＋ NADH</text><text x="380" y="562" font-size="22" font-weight="700" fill="#245b91" text-anchor="middle">LDH</text><line x1="380" y1="575" x2="380" y2="600" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="380" y="643" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">lactate ＋ NAD⁺</text><text x="380" y="692" font-size="20" font-weight="400" fill="#555b63" text-anchor="middle">低酸素時だけでなく、酸素があるときにも進む。H⁺は省略。</text></g></svg>