<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">リン酸の付け外しでPDHの活性が変わる</title><desc id="desc">リン酸の付いていないPDHとリン酸の付いたPDHを比較。PDH kinaseがリン酸を付けると活性が下がり、PDH phosphataseが外すと活性が上がる。下段の太い矢印と細い矢印はピルビン酸からacetyl-CoAへの変換量の相対的な違いを示す。</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#596573"/></marker><marker id="b" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#245da8"/></marker></defs><rect width="800" height="480" fill="white"/><g font-family="system-ui,-apple-system,sans-serif" text-anchor="middle" fill="#202124"><text x="400" y="39" font-size="29" font-weight="700">リン酸が付くと、PDHの活性が下がる</text><path d="M286 173Q400 119 506 173" fill="none" stroke="#596573" stroke-width="3" marker-end="url(#a)"/><text x="400" y="89" font-size="23">PDH kinase</text><text x="400" y="122" font-size="22">リン酸を付ける</text><path d="M508 232Q400 292 286 232" fill="none" stroke="#596573" stroke-width="3" marker-end="url(#a)"/><text x="400" y="329" font-size="23">PDH phosphatase</text><text x="400" y="360" font-size="22">リン酸を外す</text><path d="M113 179Q89 145 126 130Q167 105 190 135Q239 112 263 150Q289 188 262 214Q277 250 232 263Q199 278 174 256Q113 274 102 235Q79 205 113 179Z" fill="#e6eef8" stroke="#245da8" stroke-width="3"/><path d="M533 179Q509 145 546 130Q587 105 610 135Q659 112 683 150Q709 188 682 214Q697 250 652 263Q619 278 594 256Q533 274 522 235Q499 205 533 179Z" fill="#f0f2f4" stroke="#596573" stroke-width="3"/><text x="190" y="205" font-size="33" font-weight="700">PDH</text><text x="610" y="205" font-size="33" font-weight="700">PDH</text><path d="M677 148L712 120" stroke="#596573" stroke-width="3"/><circle cx="729" cy="105" r="23" fill="#fff" stroke="#596573" stroke-width="3"/><text x="729" y="114" font-size="26" font-weight="700">P</text><text x="190" y="311" font-size="26" font-weight="700" fill="#245da8">活性が高い</text><text x="610" y="311" font-size="26" font-weight="700">活性が低い</text><text x="89" y="398" font-size="22">pyruvate</text><text x="295" y="398" font-size="22">acetyl-CoA</text><path d="M150 389H213" stroke="#245da8" stroke-width="9"/><path d="M213 381L229 389L213 397Z" fill="#245da8"/><text x="509" y="398" font-size="22">pyruvate</text><text x="710" y="398" font-size="22">acetyl-CoA</text><path d="M570 389H633" stroke="#245da8" stroke-width="2"/><path d="M633 381L649 389L633 397Z" fill="#245da8"/><path d="M30 426H770" stroke="#d5d9df"/><text x="400" y="458" font-size="20" fill="#606773">P：リン酸基。酵素の形と変換量の違いを模式的に示す。</text></g></svg>