  <text x="685" y="369" font-family="&quot;Noto Sans CJK JP&quot;,&quot;Hiragino Sans&quot;,sans-serif" fill="#485d72" font-size="21px">核外へ出る</text>
  <path d="M860 120V205M860 268V389" stroke="#a99acd" stroke-width="7" />
  <rect x="847" y="205" width="26" height="63" rx="11" fill="#d9d0e9" stroke="#66549e" stroke-width="3" />
  <text x="877" y="291" font-family="&quot;Noto Sans CJK JP&quot;,&quot;Hiragino Sans&quot;,sans-serif" fill="#485d72" font-size="21px">核膜孔</text>
  <path d="M874 236H931" fill="none" stroke="#245d9c" stroke-width="5" stroke-linecap="round" />
  <polygon points="931,236 918,228 918,244" fill="#245d9c" />
  <circle cx="951" cy="237" r="7" fill="#d9b34e" />
  <path d="M959 237q12 -14 24 0t24 0t24 0" fill="none" stroke="#288aaa" stroke-width="6" stroke-linecap="round" />
  <text x="1032" y="245" font-family="&quot;Noto Sans CJK JP&quot;,&quot;Hiragino Sans&quot;,sans-serif" fill="#a67531" font-size="17px">AAA</text>
  <text x="952" y="329" font-family="&quot;Noto Sans CJK JP&quot;,&quot;Hiragino Sans&quot;,sans-serif" fill="#1f3045" font-size="26px" font-weight="700">mRNA</text>
  <text x="930" y="369" font-family="&quot;Noto Sans CJK JP&quot;,&quot;Hiragino Sans&quot;,sans-serif" fill="#485d72" font-size="21px">翻訳の場へ</text>
