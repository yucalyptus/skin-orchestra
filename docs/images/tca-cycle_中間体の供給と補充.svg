<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 790" role="img" aria-labelledby="title"><title id="title">TCA中間体は、合成へ出て、別の経路から補われる</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#555b63" stroke-width="1.6"/></marker></defs><rect width="760" height="790" fill="white"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif"><text x="32" y="44" font-size="28" font-weight="700" fill="#202124" text-anchor="start">TCA中間体は、合成へ出て、別の経路から補われる</text><text x="380" y="231" font-size="23" font-weight="700" fill="#202124" text-anchor="middle">citrate</text><text x="510" y="392" font-size="23" font-weight="700" fill="#202124" text-anchor="middle">α-ketoglutarate</text><text x="380" y="553" font-size="23" font-weight="700" fill="#202124" text-anchor="middle">succinyl-CoA</text><text x="250" y="392" font-size="23" font-weight="700" fill="#202124" text-anchor="middle">oxaloacetate</text><path d="M432 244 Q505 263 510 354" fill="none" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><path d="M506 419 Q499 496 428 532" fill="none" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><path d="M326 547 Q249 501 248 425" fill="none" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><path d="M251 358 Q253 284 328 239" fill="none" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="380" y="316" font-size="27" font-weight="700" fill="#202124" text-anchor="middle">TCA回路</text><text x="380" y="352" font-size="20" font-weight="400" fill="#555b63" text-anchor="middle">中間体を再生</text><line x1="380" y1="200" x2="380" y2="128" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="88" font-size="23" font-weight="400" fill="#202124" text-anchor="middle">脂肪酸・コレステロール</text><line x1="612" y1="395" x2="712" y2="395" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="606" y="445" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">アミノ酸など</text><line x1="380" y1="575" x2="380" y2="620" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="660" font-size="25" font-weight="700" fill="#202124" text-anchor="middle">heme</text><line x1="153" y1="392" x2="57" y2="392" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)"/><text x="82" y="332" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">核酸</text><text x="82" y="359" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">糖新生</text><text x="72" y="557" font-size="24" font-weight="700" fill="#245b91" text-anchor="start">pyruvate</text><path d="M107 531 Q142 461 210 418" fill="none" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="38" y="595" font-size="20" font-weight="400" fill="#555b63" text-anchor="start">carboxylase</text><text x="575" y="174" font-size="24" font-weight="700" fill="#245b91" text-anchor="middle">glutamine</text><path d="M602 196 Q683 272 577 365" fill="none" stroke="#555b63" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="572" y="208" font-size="20" font-weight="400" fill="#555b63" text-anchor="middle">glutamateを経る</text><line x1="32" y1="699" x2="728" y2="699" stroke="#cdd2d8" stroke-width="2"/><text x="380" y="740" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">外向き＝合成へ取り出す　内向き＝中間体を補う</text><text x="380" y="776" font-size="20" font-weight="400" fill="#555b63" text-anchor="middle">破線は多段階の経路。コラーゲン水酸化への利用は本文参照。</text></g></svg>