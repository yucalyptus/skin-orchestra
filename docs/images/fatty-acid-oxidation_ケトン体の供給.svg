<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 735" role="img" aria-label="肝から血流へ、ケトン体を燃料として届ける"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#667085" stroke-width="1.5"/></marker></defs><rect width="760" height="735" fill="white"/><g font-family="system-ui,-apple-system,sans-serif"><text x="28" y="44" font-size="28" fill="#202124" text-anchor="start" font-weight="700">肝から血流へ、ケトン体を燃料として届ける</text><g transform="translate(139 189) scale(0.9)"><path d="M-85 -15C-60 -59 28 -51 92 -27C107 -16 78 10 29 14C-8 20 -25 54 -67 49C-98 39 -109 13 -85 -15" stroke="#667085" stroke-width="2.5" fill="#eef1f5"/><path d="M10 -39C-2 -17 -1 -1 17 15" stroke="#667085" stroke-width="2" fill="none"/></g><text x="139" y="264" font-size="24" fill="#202124" text-anchor="middle" font-weight="700">肝</text><text x="139" y="296" font-size="24" fill="#202124" text-anchor="middle" font-weight="700">ケトン体を作る</text><text x="35" y="332" font-size="21" fill="#202124" text-anchor="start" font-weight="400">自分では利用しない</text><text x="35" y="363" font-size="20" fill="#202124" text-anchor="start" font-weight="400">（SCOT を持たない）</text><path d="M277 108V550" stroke="#d3dce6" stroke-width="45" fill="none"/><path d="M261 108V550M293 108V550" stroke="#667085" stroke-width="2" fill="none"/><text x="244" y="84" font-size="23" fill="#202124" text-anchor="start" font-weight="700">血流</text><path d="M221 188L269 188" stroke="#667085" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><circle cx="277" cy="138" r="6" fill="#245da8" stroke="#245da8" stroke-width="2"/><circle cx="277" cy="219" r="6" fill="#245da8" stroke="#245da8" stroke-width="2"/><circle cx="277" cy="298" r="6" fill="#245da8" stroke="#245da8" stroke-width="2"/><circle cx="277" cy="383" r="6" fill="#245da8" stroke="#245da8" stroke-width="2"/><circle cx="277" cy="470" r="6" fill="#245da8" stroke="#245da8" stroke-width="2"/><circle cx="277" cy="522" r="6" fill="#245da8" stroke="#245da8" stroke-width="2"/><path d="M301 160L418 160" stroke="#667085" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g transform="translate(531 151) scale(0.65)"><path d="M-2 -42C-16 -62 -37 -48 -40 -39C-70 -41 -77 -20 -67 -7C-90 11 -63 40 -44 30C-29 56 -9 48 0 34C15 57 38 47 43 29C67 39 87 11 66 -7C76 -29 55 -44 39 -38C24 -58 7 -57 -2 -42Z" stroke="#667085" stroke-width="2.5" fill="#eef1f5"/><path d="M0 -40L0 33M-41 -31C-13 -29 -34 -2 -53 -10M-52 5C-20 -4 -40 31 -16 30M38 -27C8 -30 37 1 52 -9M52 8C17 -1 39 30 16 29" stroke="#667085" stroke-width="2" fill="none"/></g><text x="623" y="144" font-size="26" fill="#202124" text-anchor="start" font-weight="700">脳</text><text x="449" y="224" font-size="21" fill="#202124" text-anchor="start" font-weight="400">絶食が続くと利用が増える</text><text x="449" y="254" font-size="20" fill="#202124" text-anchor="start" font-weight="400">glucose も必要</text><path d="M301 345L423 345" stroke="#667085" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g transform="translate(480 336) scale(0.6)"><path d="M0 -25C-28 -66 -65 -36 -48 0C-38 25 -3 50 0 53C7 47 48 18 52 -8C63 -46 25 -60 0 -25Z" stroke="#667085" stroke-width="2.5" fill="#eef1f5"/><path d="M-7 -35L-11 -64L8 -66L17 -34" stroke="#667085" stroke-width="2.5" fill="#eef1f5"/></g><path d="M559 298C603 310 610 327 652 298L672 316C632 365 616 364 566 327Z" stroke="#667085" stroke-width="2.5" fill="#eef1f5"/><path d="M571 310C609 338 628 336 660 307M579 320C613 348 630 346 666 316" stroke="#667085" stroke-width="1.5" fill="none"/><text x="456" y="409" font-size="24" fill="#202124" text-anchor="start" font-weight="700">心筋・骨格筋など</text><path d="M301 513L423 513" stroke="#667085" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M502 472C449 462 434 523 462 551C487 580 539 553 514 530C494 517 534 487 502 472Z" stroke="#667085" stroke-width="2.5" fill="#eef1f5"/><text x="559" y="530" font-size="25" fill="#202124" text-anchor="star