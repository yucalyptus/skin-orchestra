<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" font-family="Hiragino Sans, Noto Sans JP, sans-serif"><rect width="1440" height="940" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c1d23"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a34b40"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4f91"/></marker></defs><path d="M80,170 C80,110 130,90 220,90 L1000,90 C1060,90 1080,60 1120,30 C1135,20 1150,32 1140,48 C1120,80 1150,95 1210,90 L1300,90 C1360,90 1380,130 1380,180 L1380,660 C1380,720 1350,740 1290,740 L180,740 C120,740 80,710 80,660 Z" fill="#fafbfc" stroke="#64748b" stroke-width="2.5"/>
<text x="110" y="130" text-anchor="start" font-size="20" font-weight="700" fill="#64748b">メラノサイト</text>
<ellipse cx="260" cy="400" rx="150" ry="190" fill="#f2f4f7" stroke="#64748b" stroke-width="2.5"/>
<text x="260" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#64748b">メラノソーム</text>
<text x="260" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1d23">ハイドロキノン</text>
<text x="260" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1d23">ロドデノール</text>
<line x1="260" y1="345" x2="260" y2="420" stroke="#1c1d23" stroke-width="3" marker-end="url(#a)"/>
<text x="275" y="388" text-anchor="start" font-size="16" font-weight="700" fill="#1d4f91">チロシナーゼ</text>
<polygon points="279.1,481.0 260.0,492.0 240.9,481.0 240.9,459.0 260.0,448.0 279.1,459.0" fill="#fbf2f0" stroke="#a34b40" stroke-width="2.5"/>
<line x1="260.0" y1="448.0" x2="260.0" y2="437.0" stroke="#a34b40" stroke-width="2.5"/>
<circle cx="260.0" cy="432.0" r="5" fill="#a34b40"/>
<line x1="260.0" y1="492.0" x2="260.0" y2="503.0" stroke="#a34b40" stroke-width="2.5"/>
<circle cx="260.0" cy="508.0" r="5" fill="#a34b40"/>
<text x="260" y="540" text-anchor="middle" font-size="19" font-weight="700" fill="#a34b40">キノン</text>
<line x1="420" y1="420" x2="520" y2="420" stroke="#a34b40" stroke-width="3" marker-end="url(#r)"/>
<text x="650" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1d23">① グルタチオンが受け止める</text>
<circle cx="573" cy="300" r="11" fill="#e8eef6" stroke="#1d4f91" stroke-width="2"/>
<circle cx="595" cy="300" r="11" fill="#e8eef6" stroke="#1d4f91" stroke-width="2"/>
<circle cx="617" cy="300" r="11" fill="#e8eef6" stroke="#1d4f91" stroke-width="2"/>
<line x1="595" y1="289" x2="595" y2="274" stroke="#1d4f91" stroke-width="2.5"/>
<text x="595" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4f91">SH</text>
<line x1="632" y1="300" x2="658" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#b)"/>
<circle cx="678" cy="300" r="11" fill="#e8eef6" stroke="#1d4f91" stroke-width="2"/>
<circle cx="700" cy="300" r="11" fill="#e8eef6" stroke="#1d4f91" stroke-width="2"/>
<circle cx="722" cy="300" r="11" fill="#e8eef6" stroke="#1d4f91" stroke-width="2"/>
<line x1="700" y1="289" x2="700" y2="274" stroke="#1d4f91" stroke-width="2.5"/>
<polygon points="713.9,266.0 700.0,274.0 686.1,266.0 686.1,250.0 700.0,242.0 713.9,250.0" fill="#fbf2f0" stroke="#a34b40" stroke-width="2.5"/>
<line x1="686.1" y1="250.0" x2="676.6" y2="244.5" stroke="#a34b40" stroke-width="2.5"/>
<circle cx="672.3" cy="242.0" r="5" fill="#a34b40"/>
<line x1="713.9" y1="266.0" x2="723.4" y2="271.5" stroke="#a34b40" stroke-width="2.5"/>
<circle cx="727.7" cy="274.0" r="5" fill="#a34b40"/>
<text x="650" y="350" text-anchor="middle" font-size="16" font-weight="400" fill="#1c1d23">–SHでキノンに結合し、</text>
<text x="650" y="376" text-anchor="middle" font-size="16" font-weight="400" fill="#1c1d23">無害な結合物にする</text>
<text x="650" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#a34b40">キノンが作られ続けると</text>
<text x="650" y="446" text-anchor="middle" font-size="16" font-weight="700" fill="#a34b40">グルタチオンが使い切られる</text>
<line x1="530" y1="470" x2="770" y2="470" stroke="#c5cdd6" stroke-width="1.5"/>
<line x1="790" y1="420" x2="860" y2="420" stroke="#a34b40" stroke-width="3" marker-end="url(#r)"/>
<text x="1010" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1d23">② タンパク質に結合する</text>
<path d="M880,330 C880,285 925,280 950,295 C990,315 995,360 955,370 C920,380 880,370 880,330 Z" fill="#e8eef6" stroke="#1d4f91" stroke-width="2.5"/>
<path d="M965,302 q12,10 2,24" fill="none" stroke="#1d4f91" stroke-width="2"/>
<line x1="940" y1="292" x2="940" y2="272" stroke="#1d4f91" stroke-width="2.5"/>
<text x="940" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4f91">SH</text>
<path d="M1025,340 C1015,300 1055,275 1080,305 C1100,325 1140,280 1145,325 C1150,365 1090,360 1070,375 C1045,390 1030,370 1025,340 Z" fill="#e8eef6" stroke="#1d4f91" stroke-width="2.5"/>
<line x1="1090" y1="316" x2="1090" y2="272" stroke="#1d4f91" stroke-width="2.5"/>
<polygon points="1103.9,264.0 1090.0,272.0 1076.1,264.0 1076.1,248.0 1090.0,240.0 1103.9,248.0" fill="#fbf2f0" stroke="#a34b40" stroke-width="2.5"/>
<line x1="1076.1" y1="248.0" x2="1066.6" y2="242.5" stroke="#a34b40" stroke-width="2.5"/>
<circle cx="1062.3" cy="240.0" r="5" fill="#a34b40"/>
<line x1="1103.9" y1="264.0" x2="1113.4" y2="269.5" stroke="#a34b40" stroke-width="2.5"/>
<circle cx="1117.7" cy="272.0" r="5" fill="#a34b40"/>
<line x1="995" y1="330" x2="1015" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#b)"/>
<text x="1010" y="420" text-anchor="middle" font-size="16" font-weight="400" fill="#1c1d23">システイン（–SH）に結合し、</text>
<text x="1010" y="446" text-anchor="middle" font-size="16" font-weight="400" fill="#1c1d23">形が変わって働かなくなる</text>
<line x1="1010" y1="470" x2="1010" y2="520" stroke="#a34b40" stroke-width="3" marker-end="url(#r)"/>
<path d="M730,560 C780,550 840,570 900,560 S1000,550 1050,560" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M730,576 C780,566 840,586 900,576 S1000,566 1050,576" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M730,592 C780,582 840,602 900,592 S1000,582 1050,592" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M730,608 C780,598 840,618 900,608 S1000,598 1050,608" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M778,548 q6,-14 14,-4 q10,-10 12,6 q-4,12 -14,8 q-10,6 -12,-10 Z" fill="#e8eef6" stroke="#1d4f91" stroke-width="2"/>
<path d="M858,615 q6,-14 14,-4 q10,-10 12,6 q-4,12 -14,8 q-10,6 -12,-10 Z" fill="#e8eef6" stroke="#1d4f91" stroke-width="2"/>
<path d="M948,546 q6,-14 14,-4 q10,-10 12,6 q-4,12 -14,8 q-10,6 -12,-10 Z" fill="#e8eef6" stroke="#1d4f91" stroke-width="2"/>
<path d="M1008,612 q6,-14 14,-4 q10,-10 12,6 q-4,12 -14,8 q-10,6 -12,-10 Z" fill="#e8eef6" stroke="#1d4f91" stroke-width="2"/>
<text x="1090" y="566" text-anchor="start" font-size="19" font-weight="700" fill="#1c1d23">③ 小胞体に負担</text>
<text x="1090" y="594" text-anchor="start" font-size="16" font-weight="400" fill="#1c1d23">形の崩れたタンパク質が</text>
<text x="1090" y="620" text-anchor="start" font-size="16" font-weight="400" fill="#1c1d23">たまる（小胞体ストレス）</text>
<line x1="1190" y1="650" x2="1190" y2="672" stroke="#a34b40" stroke-width="3" marker-end="url(#r)"/>
<text x="1190" y="698" text-anchor="middle" font-size="18" font-weight="700" fill="#a34b40">細胞死（アポトーシス）</text>
<rect x="80" y="770" width="620" height="150" rx="14" fill="#fbf2f0" stroke="#a34b40" stroke-width="2"/>
<text x="110" y="808" text-anchor="start" font-size="19" font-weight="700" fill="#a34b40">加わる要因：活性酸素</text>
<text x="110" y="842" text-anchor="start" font-size="16" font-weight="400" fill="#1c1d23">キノンや、そこからできる重合体が活性酸素を生じる。</text>
<text x="110" y="872" text-anchor="start" font-size="16" font-weight="400" fill="#1c1d23">紫外線で量や毒性が増える。</text>
<text x="110" y="902" text-anchor="start" font-size="16" font-weight="400" fill="#1c1d23">傷害を強めるが、主な原因かは分かっていない。</text>
<rect x="760" y="770" width="620" height="150" rx="14" fill="#fbf2f0" stroke="#a34b40" stroke-width="2"/>
<text x="790" y="808" text-anchor="start" font-size="19" font-weight="700" fill="#a34b40">加わる要因：免疫</text>
<text x="790" y="842" text-anchor="start" font-size="16" font-weight="400" fill="#1c1d23">キノンが結合して形の変わったチロシナーゼを</text>
<text x="790" y="872" text-anchor="start" font-size="16" font-weight="400" fill="#1c1d23">免疫が異物とみなし、T細胞がメラノサイトを攻撃する。</text>
<text x="790" y="902" text-anchor="start" font-size="16" font-weight="400" fill="#1c1d23">モノベンゾンで示され、ロドデノールでも一部の患者でみられる。</text></svg>