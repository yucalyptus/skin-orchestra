<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">ピルビン酸から炭素1個が外れる</title><desc id="desc">PDHの反応で、炭素3個のピルビン酸から1個がCO2として外れ、残る2個のアセチル基がCoAに結合する。丸は炭素を表し、分子の立体構造と補酵素は省略。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596573"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,-apple-system,sans-serif" text-anchor="middle" fill="#202124"><text x="380" y="39" font-size="28" font-weight="700">炭素3個から、1個がCO₂として外れる</text><path d="M109 159H193 M537 159H580" stroke="#596573" stroke-width="3"/><g fill="#596573"><circle cx="109" cy="159" r="18"/><circle cx="151" cy="159" r="18"/><circle cx="193" cy="159" r="18"/><circle cx="537" cy="159" r="18"/><circle cx="579" cy="159" r="18"/><circle cx="408" cy="91" r="18"/></g><path d="M236 159H489 M341 159Q341 91 381 91" stroke="#596573" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M597 159H627" stroke="#596573" stroke-width="3"/><text x="670" y="169" font-size="29" font-weight="700">CoA</text><text x="290" y="133" font-size="25" font-weight="700">PDH</text><text x="464" y="101" font-size="26">CO₂</text><text x="151" y="222" font-size="29" font-weight="700">pyruvate</text><text x="151" y="256" font-size="23">ピルビン酸</text><text x="599" y="222" font-size="29" font-weight="700">acetyl-CoA</text><text x="599" y="256" font-size="23">炭素2個のアセチル基＋CoA</text><text x="380" y="315" font-size="21" fill="#606773">● は炭素。CoA内の炭素や補酵素などは省略。</text></g></svg>
