<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img"><title>UVAの光増感反応</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#1d4f91"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif} </style><rect width="1000" height="550" fill="white"/><text x="40" y="55" font-size="32" fill="#1c1d23" text-anchor="start">紫外線のエネルギーが、酸素へ渡る</text><text x="40" y="96" font-size="20" fill="#1c1d23" text-anchor="start">UVAによる光増感反応</text><text x="65" y="208" font-size="32" fill="#1c1d23" text-anchor="start">UVA</text><path d="M140 170 l18 16 -18 16 18 16 -18 16" stroke="#64748b" fill="none" stroke-width="4"/><path d="M170 208 L245 208" stroke="#1d4f91" fill="none" stroke-width="3" marker-end="url(#a)"/><rect x="265" y="142" width="275" height="142" rx="18" fill="#f2f4f7"/><text x="300" y="192" font-size="24" fill="#1c1d23" text-anchor="start">皮膚内の分子</text><text x="300" y="241" font-size="21" fill="#1c1d23" text-anchor="start">光を吸収して励起</text><path d="M540 187 L650 151" stroke="#1d4f91" fill="none" stroke-width="3" marker-end="url(#a)"/><path d="M540 241 L650 310" stroke="#1d4f91" fill="none" stroke-width="3" marker-end="url(#a)"/><text x="589" y="132" font-size="17" fill="#1c1d23" text-anchor="middle">エネルギーを渡す</text><text x="554" y="341" font-size="18" fill="#1c1d23" text-anchor="start">電子を渡す</text><rect x="670" y="105" width="285" height="113" rx="18" fill="#f2f4f7"/><text x="700" y="148" font-size="32" fill="#1c1d23" text-anchor="start">O₂ → ¹O₂</text><text x="700" y="188" font-size="22" fill="#1c1d23" text-anchor="start">一重項酸素</text><rect x="670" y="283" width="285" height="113" rx="18" fill="#f2f4f7"/><text x="700" y="326" font-size="32" fill="#1c1d23" text-anchor="start">O₂ → O₂•⁻</text><text x="700" y="366" font-size="22" fill="#1c1d23" text-anchor="start">スーパーオキシド</text><text x="40" y="459" font-size="24" fill="#1c1d23" text-anchor="start">酸素に何を渡すかによって、生じるROSが変わります。</text><text x="40" y="511" font-size="19" fill="#1c1d23" text-anchor="start">UVBには、DNAが光を吸収して直接傷つく経路（CPD形成）もあります。</text></svg>