<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" role="img" aria-labelledby="title desc">
<title id="title">脂肪滴の中性脂肪から、脂肪酸を取り出す</title>
<desc id="desc">上段はカテコールアミンからPKAへ伝わる調節の信号。下段はATGL、HSL、MGLが主に担う脂肪酸の切り出し。中性脂肪から脂肪酸が1本ずつ外れ、グリセロールが残る。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.8"/></marker></defs>
<rect width="900" height="740" fill="#fff"/>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif" fill="#1c1d23">
<text x="32" y="44" font-size="28" font-weight="700" fill="#1c1d23" text-anchor="start">脂肪滴の中性脂肪から、脂肪酸を取り出す</text>
<rect x="24" y="72" width="852" height="44" rx="3" fill="#f2f4f7"/>
<text x="40" y="102" font-size="24" font-weight="700" fill="#1c1d23" text-anchor="start">調節：ホルモンの信号で、脂肪分解を促す</text>
<text x="143" y="156" font-size="24" font-weight="700" fill="#1c1d23" text-anchor="middle">カテコールアミン</text>
<text x="143" y="185" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">アドレナリンなど</text>
<path d="M258 146H308" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="405" y="156" font-size="25" font-weight="700" fill="#1c1d23" text-anchor="middle">β受容体</text>
<text x="405" y="185" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">細胞表面</text>
<path d="M480 146H531" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="590" y="156" font-size="28" font-weight="700" fill="#1c1d23" text-anchor="middle">cAMP</text>
<text x="590" y="185" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">細胞内の信号</text>
<path d="M653 146H710" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="782" y="156" font-size="28" font-weight="700" fill="#1c1d23" text-anchor="middle">PKA</text>
<text x="782" y="185" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">リン酸化する酵素</text>
<path d="M782 197V215H450V234" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="450" y="264" font-size="24" font-weight="400" fill="#1c1d23" text-anchor="middle">HSLと脂肪滴表面のタンパク質をリン酸化</text>
<path d="M450 279V304" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="450" y="334" font-size="24" font-weight="700" fill="#1d4f91" text-anchor="middle">脂肪滴でATGL・HSLが働き、分解が進む</text>
<rect x="24" y="365" width="852" height="44" rx="3" fill="#f2f4f7"/>
<text x="40" y="395" font-size="24" font-weight="700" fill="#1c1d23" text-anchor="start">反応：脂肪滴の中性脂肪から、脂肪酸を1本ずつ外す</text>
<text x="130" y="449" font-size="24" font-weight="700" fill="#1c1d23" text-anchor="middle">中性脂肪（TG）</text>
<path d="M96 480V550" stroke="#64748b" stroke-width="3" fill="none"/>
<circle cx="96" cy="480" r="4" fill="#64748b"/>
<path d="M108 480l12 -8 12 8 12 -8 12 8 12 -8 12 8" fill="none" stroke="#1d4f91" stroke-width="3" stroke-linejoin="round"/>
<circle cx="96" cy="515" r="4" fill="#64748b"/>
<path d="M108 515l12 -8 12 8 12 -8 12 8 12 -8 12 8" fill="none" stroke="#1d4f91" stroke-width="3" stroke-linejoin="round"/>
<circle cx="96" cy="550" r="4" fill="#64748b"/>
<path d="M108 550l12 -8 12 8 12 -8 12 8 12 -8 12 8" fill="none" stroke="#1d4f91" stroke-width="3" stroke-linejoin="round"/>
<text x="130" y="588" font-size="21" font-weight="400" fill="#64748b" text-anchor="middle">脂肪酸3本</text>
<text x="350" y="449" font-size="24" font-weight="700" fill="#1c1d23" text-anchor="middle">DAG</text>
<path d="M316 480V550" stroke="#64748b" stroke-width="3" fill="none"/>
<circle cx="316" cy="480" r="4" fill="#64748b"/>
<path d="M328 480l12 -8 12 8 12 -8 12 8 12 -8 12 8" fill="none" stroke="#1d4f91" stroke-width="3" stroke-linejoin="round"/>
<circle cx="316" cy="515" r="4" fill="#64748b"/>
<path d="M328 515l12 -8 12 8 12 -8 12 8 12 -8 12 8" fill="none" stroke="#1d4f91" stroke-width="3" stroke-linejoin="round"/>
<circle cx="316" cy="550" r="4" fill="#64748b"/>
<text x="350" y="588" font-size="21" font-weight="400" fill="#64748b" text-anchor="middle">脂肪酸2本</text>
<text x="570" y="449" font-size="24" font-weight="700" fill="#1c1d23" text-anchor="middle">MAG</text>
<path d="M536 480V550" stroke="#64748b" stroke-width="3" fill="none"/>
<circle cx="536" cy="480" r="4" fill="#64748b"/>
<path d="M548 480l12 -8 12 8 12 -8 12 8 12 -8 12 8" fill="none" stroke="#1d4f91" stroke-width="3" stroke-linejoin="round"/>
<circle cx="536" cy="515" r="4" fill="#64748b"/>
<circle cx="536" cy="550" r="4" fill="#64748b"/>
<text x="570" y="588" font-size="21" font-weight="400" fill="#64748b" text-anchor="middle">脂肪酸1本</text>
<text x="790" y="449" font-size="24" font-weight="700" fill="#1c1d23" text-anchor="middle">glycerol</text>
<path d="M756 480V550" stroke="#64748b" stroke-width="3" fill="none"/>
<circle cx="756" cy="480" r="4" fill="#64748b"/>
<circle cx="756" cy="515" r="4" fill="#64748b"/>
<circle cx="756" cy="550" r="4" fill="#64748b"/>
<text x="790" y="588" font-size="21" font-weight="400" fill="#64748b" text-anchor="middle">グリセロール</text>
<text x="240" y="485" font-size="23" font-weight="700" fill="#1d4f91" text-anchor="middle">ATGL</text>
<path d="M201 515H279" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M240 532V619" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M204 639l12 -8 12 8 12 -8 12 8 12 -8 12 8" fill="none" stroke="#1d4f91" stroke-width="3" stroke-linejoin="round"/>
<text x="240" y="677" font-size="21" font-weight="700" fill="#1c1d23" text-anchor="middle">脂肪酸1本</text>
<text x="460" y="485" font-size="23" font-weight="700" fill="#1d4f91" text-anchor="middle">HSL</text>
<path d="M421 515H499" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M460 532V619" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M424 639l12 -8 12 8 12 -8 12 8 12 -8 12 8" fill="none" stroke="#1d4f91" stroke-width="3" stroke-linejoin="round"/>
<text x="460" y="677" font-size="21" font-weight="700" fill="#1c1d23" text-anchor="middle">脂肪酸1本</text>
<text x="680" y="485" font-size="23" font-weight="700" fill="#1d4f91" text-anchor="middle">MGL</text>
<path d="M641 515H719" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M680 532V619" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M644 639l12 -8 12 8 12 -8 12 8 12 -8 12 8" fill="none" stroke="#1d4f91" stroke-width="3" stroke-linejoin="round"/>
<text x="680" y="677" font-size="21" font-weight="700" fill="#1c1d23" text-anchor="middle">脂肪酸1本</text>
<text x="32" y="719" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">主な担当酵素を示す模式図。結合の詳細と加水分解の水は省略。</text>
</g></svg>