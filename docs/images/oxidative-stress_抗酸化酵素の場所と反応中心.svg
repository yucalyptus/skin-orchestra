<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">SODに組み込まれる金属と、その役割</title>
<desc id="desc">左はSOD1とSOD3。タンパク質内のCuが電子を受け渡し、Znが構造を支える。右はSOD2。タンパク質内のMnが電子を受け渡す。タンパク質の形と金属の配置は模式的。</desc>
<style>text{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;fill:#1c1d23}.title{font-size:32px;font-weight:700}.head{font-size:30px;font-weight:700}.metal{font-size:42px;font-weight:700}.role{font-size:26px;font-weight:700}.body{font-size:24px}.note{font-size:22px;fill:#494c54}.active{fill:#1d4f91}</style>
<rect width="1000" height="620" fill="#fff"/>
<text x="40" y="49" class="title">SODは、タンパク質に金属を組み込んだ酵素</text>
<path d="M500 100 V553" stroke="#c5cdd6" stroke-width="2"/>
<text x="250" y="130" class="head" text-anchor="middle">SOD1・SOD3</text>
<text x="750" y="130" class="head" text-anchor="middle">SOD2</text>
<rect x="55" y="165" width="390" height="157" rx="65" fill="#f2f4f7"/>
<rect x="555" y="165" width="390" height="157" rx="65" fill="#f2f4f7"/>
<text x="250" y="201" class="note" text-anchor="middle">SODタンパク質</text>
<text x="750" y="201" class="note" text-anchor="middle">SODタンパク質</text>
<circle cx="150" cy="261" r="40" fill="#fff" stroke="#1d4f91" stroke-width="2"/>
<circle cx="350" cy="261" r="40" fill="#fff" stroke="#64748b" stroke-width="2"/>
<circle cx="750" cy="261" r="40" fill="#fff" stroke="#1d4f91" stroke-width="2"/>
<text x="150" y="276" class="metal active" text-anchor="middle">Cu</text>
<text x="350" y="276" class="metal" text-anchor="middle">Zn</text>
<text x="750" y="276" class="metal active" text-anchor="middle">Mn</text>
<path d="M150 304 V350 M350 304 V350 M750 304 V350" stroke="#64748b" stroke-width="2"/>
<text x="150" y="384" class="body" text-anchor="middle">銅</text>
<text x="350" y="384" class="body" text-anchor="middle">亜鉛</text>
<text x="750" y="384" class="body" text-anchor="middle">マンガン</text>
<text x="150" y="427" class="role active" text-anchor="middle">電子を</text>
<text x="150" y="461" class="role active" text-anchor="middle">受け渡す</text>
<text x="350" y="427" class="role" text-anchor="middle">構造を</text>
<text x="350" y="461" class="role" text-anchor="middle">支える</text>
<text x="750" y="427" class="role active" text-anchor="middle">電子を</text>
<text x="750" y="461" class="role active" text-anchor="middle">受け渡す</text>
<text x="250" y="515" class="note" text-anchor="middle">SOD1：主に細胞質</text>
<text x="250" y="546" class="note" text-anchor="middle">SOD3：ECM・細胞表面</text>
<text x="750" y="515" class="note" text-anchor="middle">ミトコンドリアmatrix</text>
<text x="40" y="598" class="note">タンパク質の形と金属の配置は模式図です。実際の立体構造とは異なります。</text>
</svg>
