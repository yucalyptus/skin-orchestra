<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 871" role="img" aria-label="糖の炭素から脂肪酸を作る"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#667085" stroke-width="1.5"/></marker></defs><rect width="760" height="871" fill="white"/><g font-family="system-ui,-apple-system,sans-serif"><text x="28" y="44" font-size="28" fill="#202124" text-anchor="start" font-weight="700">糖の炭素から脂肪酸を作る</text><text x="35" y="94" font-size="22" fill="#202124" text-anchor="start" font-weight="700">細胞質</text><text x="205" y="117" font-size="27" fill="#202124" text-anchor="middle" font-weight="700">glucose</text><text x="205" y="146" font-size="20" fill="#202124" text-anchor="middle" font-weight="400">グルコース</text><path d="M205 161L205 199" stroke="#667085" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="224" y="185" font-size="20" fill="#202124" text-anchor="start" font-weight="400">解糖系</text><text x="205" y="231" font-size="27" fill="#202124" text-anchor="middle" font-weight="700">pyruvate</text><text x="205" y="260" font-size="20" fill="#202124" text-anchor="middle" font-weight="400">ピルビン酸</text><path d="M66 323C66 284 325 284 325 323V480C325 523 66 523 66 480Z" stroke="#667085" stroke-width="2.5" fill="#f4f7fb"/><path d="M78 326C78 300 312 300 312 326V477C312 508 78 508 78 477Z" stroke="#b1bdcb" stroke-width="2" fill="none"/><path d="M205 273L205 336" stroke="#667085" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="205" y="367" font-size="25" fill="#202124" text-anchor="middle" font-weight="700">acetyl-CoA</text><path d="M205 383L205 421" stroke="#667085" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="205" y="453" font-size="25" fill="#202124" text-anchor="middle" font-weight="700">citrate</text><text x="205" y="482" font-size="20" fill="#202124" text-anchor="middle" font-weight="400">クエン酸</text><text x="64" y="557" font-size="23" fill="#202124" text-anchor="start" font-weight="700">ミトコンドリア</text><path d="M260 445L489 445" stroke="#667085" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="385" y="413" font-size="21" fill="#202124" text-anchor="middle" font-weight="400">citrate を外へ運ぶ</text><text x="590" y="453" font-size="25" fill="#202124" text-anchor="middle" font-weight="700">citrate</text><path d="M590 469L590 506" stroke="#667085" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="614" y="497" font-size="21" fill="#245da8" text-anchor="start" font-weight="400">ACLY</text><text x="590" y="539" font-size="25" fill="#202124" text-anchor="middle" font-weight="700">acetyl-CoA</text><path d="M590 553L590 592" stroke="#667085" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="614" y="581" font-size="21" fill="#245da8" text-anchor="start" font-weight="400">ACC</text><text x="590" y="625" font-size="25" fill="#202124" text-anchor="middle" font-weight="700">malonyl-CoA</text><path d="M590 639L590 678" stroke="#667085" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="614" y="667" font-size="21" fill="#245da8" text-anchor="start" font-weight="400">FASN</text><text x="590" y="710" font-size="25" fill="#202124" text-anchor="middle" font-weight="700">palmitate</text><g transform="translate(505 745) scale(2.4)"><path d="M0 0L12 -10L24 0L36 -10L48 0L60 -10" stroke="#245da8" stroke-width="3" fill="none"/></g><text x="590" y="785" font-size="20" fill="#202124" text-anchor="middle" font-weight="400">パルミチン酸（炭素16個）</text><text x="33" y="620" font-size="21" fill="#202124" text-anchor="start" font-weight="400">acetyl-CoA をそのまま出すのでなく、</text><text x="33" y="652" font-size="23" fill="#245da8" text-anchor="start" font-weight="700">citrate にして膜を越える</text><text x="33" y="840" font-size="20" fill="#202124" text-anchor="start" font-weight="400">炭素の主な流れ。補基質や併産物、膜輸送の細部は省略。</text></g></svg>