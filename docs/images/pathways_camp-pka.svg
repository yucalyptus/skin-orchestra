<text x="380" y="184" text-anchor="middle" font-size="21" fill="#1c1d23" font-weight="400">MC1R</text>
<text x="43" y="229" text-anchor="start" font-size="17" fill="#64748b" font-weight="400">細胞質</text>
<text x="380" y="249" text-anchor="middle" font-size="22" fill="#1c1d23" font-weight="400">Gs・アデニル酸シクラーゼ</text>
