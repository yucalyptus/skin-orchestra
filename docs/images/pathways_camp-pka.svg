<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" role="img" aria-labelledby="title"><title id="title">cAMP–PKA｜メラノサイトでの例</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1d4f91"/></marker></defs><rect width="760" height="800" fill="white"/><g font-family="Hiragino Sans, Noto Sans JP, sans-serif" fill="#1c1d23">
<text x="30" y="40" text-anchor="start" font-size="25" fill="#1c1d23" font-weight="600">cAMP–PKA｜メラノサイトでの例</text>
