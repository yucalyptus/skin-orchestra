<svg xmlns="http://www.w3.org/2000/svg" width="760" height="730" viewBox="0 0 760 730" role="img" aria-labelledby="title"><title id="title">Nrf2–Keap1｜防御に必要な酵素を増やす</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1d4f91"/></marker></defs><rect width="760" height="730" fill="white"/><g font-family="Hiragino Sans, Noto Sans JP, sans-serif" fill="#1c1d23">
<text x="30" y="40" text-anchor="start" font-size="25" fill="#1c1d23" font-weight="600">Nrf2–Keap1｜防御に必要な酵素を増やす</text>
<rect x="20" y="75" width="350" height="370" rx="18" fill="#f2f4f7" stroke="#c5cdd6" stroke-width="2"/>
<text x="195" y="116" text-anchor="middle" font-size="20" fill="#1c1d23" font-weight="600">通常</text>
<rect x="390" y="75" width="350" height="370" rx="18" fill="#f2f4f7" stroke="#c5cdd6" stroke-width="2"/>
<text x="565" y="116" text-anchor="middle" font-size="20" fill="#1c1d23" font-weight="600">酸化ストレスなどがあるとき</text>
<text x="195" y="178" text-anchor="middle" font-size="22" fill="#1c1d23" font-weight="400">Keap1を介して</text>
<text x="195" y="213" text-anchor="middle" font-size="22" fill="#1c1d23" font-weight="400">Nrf2の分解が進む</text>
<path d="M195 236 L195 286" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="195" y="331" text-anchor="middle" font-size="24" fill="#1c1d23" font-weight="400">Nrf2は少ない</text>
<text x="565" y="178" text-anchor="middle" font-size="22" fill="#1c1d23" font-weight="400">Keap1による</text>
<text x="565" y="213" text-anchor="middle" font-size="22" fill="#1c1d23" font-weight="400">分解の制御が変わる</text>
<path d="M565 236 L565 286" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="565" y="331" text-anchor="middle" font-size="24" fill="#1c1d23" font-weight="400">Nrf2が蓄積</text>
<rect x="110" y="490" width="540" height="160" rx="55" fill="#ffffff" stroke="#1d4f91" stroke-width="2"/>
<text x="147" y="525" text-anchor="middle" font-size="19" fill="#1d4f91" font-weight="400">核</text>
<path d="M565 355 L460 517" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="528.5" y="436.0" text-anchor="start" font-size="17" fill="#64748b" font-weight="400">核へ移動</text>
<text x="380" y="554" text-anchor="middle" font-size="24" fill="#1d4f91" font-weight="400">Nrf2 ＋ small Maf</text>
<text x="380" y="598" text-anchor="middle" font-size="20" fill="#1c1d23" font-weight="400">AREを介して抗酸化・解毒の遺伝子発現</text>
<text x="30" y="712" text-anchor="start" font-size="16" fill="#64748b" font-weight="400">矢印：代表的な信号の流れ。途中の分子・分岐は一部省略。</text>
</g></svg>