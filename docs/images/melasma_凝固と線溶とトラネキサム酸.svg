<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title"><title id="title">凝固と線溶、トラネキサム酸が作用する場所</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1d4f91"/></marker>
<marker id="bar" viewBox="0 0 5 22" refX="2.5" refY="11" markerWidth="5" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><rect x="0" y="0" width="5" height="22" fill="#a34b40"/></marker></defs>
<rect width="1000" height="560" fill="white"/><g font-family="Hiragino Sans, Noto Sans JP, sans-serif" fill="#1c1d23">
<rect x="10" y="10" width="980" height="200" rx="16" fill="#f2f4f7" stroke="#c5cdd6" stroke-width="2"/>
<text x="32" y="48" text-anchor="start" font-size="22" fill="#1c1d23" font-weight="600">凝固：血栓を作る</text>
<rect x="40" y="90" width="200" height="60" rx="12" fill="white" stroke="#1d4f91" stroke-width="2"/>
<text x="140.0" y="116.0" text-anchor="middle" font-size="21" fill="#1c1d23" font-weight="400">フィブリノゲン</text>
<text x="140.0" y="142.0" text-anchor="middle" font-size="17" fill="#64748b" font-weight="400">血液中に溶けている</text>
<path d="M240 120 L476 120" fill="none" stroke="#1d4f91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="358" y="106" text-anchor="middle" font-size="19" fill="#1d4f91" font-weight="600">トロンビン</text>
<text x="358" y="146" text-anchor="middle" font-size="15" fill="#64748b" font-weight="400">（凝固の酵素）</text>
<rect x="480" y="90" width="230" height="60" rx="12" fill="white" stroke="#1d4f91" stroke-width="3"/>
<text x="595.0" y="116.0" text-anchor="middle" font-size="22" fill="#1c1d23" font-weight="600">フィブリン</text>
<text x="595.0" y="142.0" text-anchor="middle" font-size="17" fill="#64748b" font-weight="400">網になって血栓を固める</text>
<text x="860" y="112" text-anchor="middle" font-size="17" fill="#64748b" font-weight="400">トラネキサム酸は</text>
<text x="860" y="136" text-anchor="middle" font-size="17" fill="#64748b" font-weight="400">この反応を進めない</text>
<rect x="10" y="230" width="980" height="250" rx="16" fill="#f2f4f7" stroke="#c5cdd6" stroke-width="2"/>
<text x="32" y="268" text-anchor="start" font-size="22" fill="#1c1d23" font-weight="600">線溶：血栓を溶かす</text>
<rect x="40" y="300" width="200" height="60" rx="12" fill="white" stroke="#1d4f91" stroke-width="2"/>
<text x="140.0" y="337.56" text-anchor="middle" font-size="21" fill="#1c1d23" font-weight="400">プラスミノゲン</text>
<path d="M240 330 L366 330" fill="none" stroke="#1d4f91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="303" y="316" text-anchor="middle" font-size="17" fill="#1d4f91" font-weight="600">tPAなど</text>
<rect x="370" y="300" width="170" height="60" rx="12" fill="white" stroke="#1d4f91" stroke-width="3"/>
<text x="455.0" y="337.92" text-anchor="middle" font-size="22" fill="#1c1d23" font-weight="600">プラスミン</text>
<path d="M500 300 L560 154" fill="none" stroke="#1d4f91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="505" y="180" text-anchor="end" font-size="17" fill="#1d4f91" font-weight="600">フィブリンについて</text>
<text x="505" y="204" text-anchor="end" font-size="17" fill="#1d4f91" font-weight="600">分解する（血栓が溶ける）</text>
<rect x="600" y="380" width="300" height="74" rx="12" fill="#fbf2f0" stroke="#a34b40" stroke-width="3"/>
<text x="750.0" y="413.0" text-anchor="middle" font-size="22" fill="#1c1d23" font-weight="600">トラネキサム酸</text>
<text x="750.0" y="439.0" text-anchor="middle" font-size="17" fill="#64748b" font-weight="400">リシン結合部位に結合</text>
<path d="M680 380 L536 232" fill="none" stroke="#a34b40" stroke-width="3" marker-end="url(#bar)"/>
<text x="632" y="300" text-anchor="start" font-size="16" fill="#a34b40" font-weight="600">フィブリンに</text>
<text x="632" y="320" text-anchor="start" font-size="16" fill="#a34b40" font-weight="600">つけなくする</text>
<path d="M36 524 L84 524" fill="none" stroke="#1d4f91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="96" y="531" text-anchor="start" font-size="18" fill="#1c1d23" font-weight="400">反応・作用が進む</text>
<path d="M300 524 L348 524" fill="none" stroke="#a34b40" stroke-width="3" marker-end="url(#bar)"/>
<text x="360" y="531" text-anchor="start" font-size="18" fill="#a34b40" font-weight="400">働きを止める</text>
</g></svg>