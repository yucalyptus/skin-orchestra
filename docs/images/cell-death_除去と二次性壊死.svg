<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 685" role="img"><title>efferocytosisと二次性ネクローシス</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#1d4f91"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif} </style><rect width="1000" height="685" fill="white"/><text x="40" y="55" font-size="32" fill="#1c1d23" text-anchor="start">apoptosisのあと、除去が間に合うか</text><circle cx="120" cy="161" r="33" fill="#f2f4f7" stroke="#64748b" stroke-width="3"/><circle cx="120" cy="161" r="11.0" fill="#64748b"/><text x="183" y="150" font-size="27" fill="#1c1d23" text-anchor="start">膜に包まれた細胞・小体</text><text x="183" y="188" font-size="21" fill="#1c1d23" text-anchor="start">PSが表面に出て、貪食の目印になる</text><path d="M400 224 L249 305" stroke="#1d4f91" fill="none" stroke-width="3" marker-end="url(#a)"/><path d="M530 224 L747 305" stroke="#1d4f91" fill="none" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="326" width="437" height="256" rx="18" fill="#f2f4f7"/><rect x="519" y="326" width="437" height="256" rx="18" fill="#fbf2f0"/><text x="68" y="370" font-size="26" fill="#1c1d23" text-anchor="start">速やかに取り込まれる</text><text x="550" y="370" font-size="26" fill="#1c1d23" text-anchor="start">取り残される</text><circle cx="122" cy="433" r="25" fill="#f2f4f7" stroke="#64748b" stroke-width="3"/><circle cx="122" cy="433" r="8.333333333333334" fill="#64748b"/><text x="170" y="444" font-size="25" fill="#1c1d23" text-anchor="start">efferocytosis</text><path d="M577 433 A28 28 0 1 1 624.6 452.6" fill="#fbf2f0" stroke="#a34b40" stroke-width="4"/><circle cx="630" cy="469" r="6" fill="#a34b40"/><circle cx="654" cy="493" r="6" fill="#a34b40"/><circle cx="677" cy="467" r="6" fill="#a34b40"/><circle cx="677" cy="505" r="6" fill="#a34b40"/><text x="710" y="434" font-size="24" fill="#1c1d23" text-anchor="start">二次性</text><text x="710" y="468" font-size="24" fill="#1c1d23" text-anchor="start">ネクローシス</text><text x="68" y="526" font-size="23" fill="#1c1d23" text-anchor="start">中身の漏出を抑える</text><text x="68" y="559" font-size="21" fill="#1c1d23" text-anchor="start">炎症の収束にもつながる</text><text x="550" y="526" font-size="23" fill="#1c1d23" text-anchor="start">膜が破綻し、中身が漏れる</text><text x="550" y="559" font-size="21" fill="#1c1d23" text-anchor="start">炎症を誘導しうる</text><text x="40" y="639" font-size="21" fill="#1c1d23" text-anchor="start">細胞を死なせることと、その細胞を除去することは、連携して進む必要があります。</text></svg>