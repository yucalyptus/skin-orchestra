<svg xmlns="http://www.w3.org/2000/svg" width="760" height="710" viewBox="0 0 760 710" role="img" aria-labelledby="title"><title id="title">NF-κB｜抑制が外れ、核で働く</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1d4f91"/></marker></defs><rect width="760" height="710" fill="white"/><g font-family="Hiragino Sans, Noto Sans JP, sans-serif" fill="#1c1d23">
<text x="30" y="40" text-anchor="start" font-size="25" fill="#1c1d23" font-weight="600">NF-κB｜抑制が外れ、核で働く</text>
<rect x="20" y="175" width="720" height="485" rx="24" fill="#f2f4f7" stroke="#c5cdd6" stroke-width="2"/>
<text x="40" y="92" text-anchor="start" font-size="17" fill="#64748b" font-weight="400">細胞外</text>
<text x="380" y="105" text-anchor="middle" font-size="23" fill="#1c1d23" font-weight="600">TNF・IL-1・微生物由来の刺激</text>
<path d="M380 120 L380 148" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<path d="M20 173 H740 M20 183 H740" stroke="#c5cdd6" stroke-width="3"/>
<text x="46" y="165" text-anchor="start" font-size="17" fill="#64748b" font-weight="400">細胞膜</text>
<rect x="220.0" y="150.0" width="320" height="54" rx="14" fill="white" stroke="#1d4f91" stroke-width="2"/>
<text x="380" y="184" text-anchor="middle" font-size="21" fill="#1c1d23" font-weight="400">それぞれの受容体</text>
<text x="43" y="229" text-anchor="start" font-size="17" fill="#64748b" font-weight="400">細胞質</text>
<rect x="145.0" y="252.0" width="170" height="54" rx="14" fill="white" stroke="#1d4f91" stroke-width="2"/>
<text x="230" y="286" text-anchor="middle" font-size="21" fill="#1c1d23" font-weight="400">IKK</text>
<path d="M330 205 L230 250" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<rect x="420" y="242" width="290" height="135" rx="18" fill="white" stroke="#c5cdd6" stroke-width="2"/>
<text x="565" y="278" text-anchor="middle" font-size="17" fill="#64748b" font-weight="400">刺激を受ける前</text>
<text x="565" y="319" text-anchor="middle" font-size="25" fill="#1c1d23" font-weight="400">IκB ＋ NF-κB</text>
<text x="565" y="351" text-anchor="middle" font-size="17" fill="#1c1d23" font-weight="400">結合して働きを抑える</text>
<text x="260" y="397" text-anchor="middle" font-size="23" fill="#1c1d23" font-weight="400">IκBが分解される</text>
<path d="M230 308 L250 366" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<path d="M565 380 L410 418" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="565" y="444" text-anchor="middle" font-size="17" fill="#1c1d23" font-weight="400">NF-κBが離れる</text>
<rect x="110" y="470" width="540" height="170" rx="55" fill="#ffffff" stroke="#1d4f91" stroke-width="2"/>
<text x="147" y="505" text-anchor="middle" font-size="19" fill="#1d4f91" font-weight="400">核</text>
<path d="M350 418 L350 517" fill="none" stroke="#1d4f91" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="366.0" y="467.5" text-anchor="start" font-size="17" fill="#64748b" font-weight="400">核へ移動</text>
<text x="380" y="550" text-anchor="middle" font-size="26" fill="#1d4f91" font-weight="600">NF-κB</text>
<text x="380" y="598" text-anchor="middle" font-size="22" fill="#1c1d23" font-weight="400">炎症・防御に関わる遺伝子発現</text>
<text x="30" y="692" text-anchor="start" font-size="16" fill="#64748b" font-weight="400">矢印：代表的な信号の流れ。途中の分子・分岐は一部省略。</text>
</g></svg>