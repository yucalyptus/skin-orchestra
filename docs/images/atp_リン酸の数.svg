<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title"><title id="title">ATP・ADP・AMPはリン酸の数が異なる</title><rect width="760" height="330" fill="white"/><g font-family="system-ui,-apple-system,sans-serif" fill="#1c1d23"><text x="28" y="38" font-size="28" fill="#1c1d23" text-anchor="start" font-weight="700">違いは、リン酸の数</text><text x="30" y="110" font-size="30" fill="#1c1d23" text-anchor="start" font-weight="700">ATP</text><text x="165" y="108" font-size="24" fill="#1c1d23" text-anchor="start" font-weight="400">adenosine</text><line x1="310" y1="102" x2="369" y2="102" stroke="#64748b" stroke-width="2"/><circle cx="395" cy="102" r="25" fill="#f2f4f7" stroke="#1d4f91" stroke-width="2"/><text x="395" y="111" font-size="25" fill="#1d4f91" text-anchor="middle" font-weight="700">P</text><line x1="421" y1="102" x2="467" y2="102" stroke="#64748b" stroke-width="2"/><circle cx="493" cy="102" r="25" fill="#f2f4f7" stroke="#1d4f91" stroke-width="2"/><text x="493" y="111" font-size="25" fill="#1d4f91" text-anchor="middle" font-weight="700">P</text><line x1="519" y1="102" x2="565" y2="102" stroke="#64748b" stroke-width="2"/><circle cx="591" cy="102" r="25" fill="#f2f4f7" stroke="#1d4f91" stroke-width="2"/><text x="591" y="111" font-size="25" fill="#1d4f91" text-anchor="middle" font-weight="700">P</text><text x="710" y="110" font-size="24" fill="#1c1d23" text-anchor="end" font-weight="400">3個</text><text x="30" y="193" font-size="30" fill="#1c1d23" text-anchor="start" font-weight="700">ADP</text><text x="165" y="191" font-size="24" fill="#1c1d23" text-anchor="start" font-weight="400">adenosine</text><line x1="310" y1="185" x2="369" y2="185" stroke="#64748b" stroke-width="2"/><circle cx="395" cy="185" r="25" fill="#f2f4f7" stroke="#1d4f91" stroke-width="2"/><text x="395" y="194" font-size="25" fill="#1d4f91" text-anchor="middle" font-weight="700">P</text><line x1="421" y1="185" x2="467" y2="185" stroke="#64748b" stroke-width="2"/><circle cx="493" cy="185" r="25" fill="#f2f4f7" stroke="#1d4f91" stroke-width="2"/><text x="493" y="194" font-size="25" fill="#1d4f91" text-anchor="middle" font-weight="700">P</text><text x="710" y="193" font-size="24" fill="#1c1d23" text-anchor="end" font-weight="400">2個</text><text x="30" y="276" font-size="30" fill="#1c1d23" text-anchor="start" font-weight="700">AMP</text><text x="165" y="274" font-size="24" fill="#1c1d23" text-anchor="start" font-weight="400">adenosine</text><line x1="310" y1="268" x2="369" y2="268" stroke="#64748b" stroke-width="2"/><circle cx="395" cy="268" r="25" fill="#f2f4f7" stroke="#1d4f91" stroke-width="2"/><text x="395" y="277" font-size="25" fill="#1d4f91" text-anchor="middle" font-weight="700">P</text><text x="710" y="276" font-size="24" fill="#1c1d23" text-anchor="end" font-weight="400">1個</text><text x="28" y="317" font-size="20" fill="#64748b" text-anchor="start" font-weight="400">Pはリン酸を表す記号。分子の立体構造は省略。</text></g></svg>