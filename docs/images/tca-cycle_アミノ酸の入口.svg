<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">アミノ酸もTCA回路につながる</title><desc id="desc">アラニンはピルビン酸とacetyl-CoAを経て、アスパラギン酸はオキサロ酢酸として、グルタミン酸はαケトグルタル酸としてTCA回路につながる。代表的な3例を示し途中の反応と窒素の移動は省略。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596573"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245da8"/></marker></defs><rect width="900" height="650" fill="white"/><g font-family="system-ui,-apple-system,sans-serif" text-anchor="middle" fill="#202124"><text x="450" y="41" font-size="30" font-weight="700">アミノ酸も、TCA回路につながる</text><text x="450" y="78" font-size="23">種類によって、合流する場所が違う</text><text x="155" y="135" font-size="27" font-weight="700" fill="#245da8">アラニン</text><path d="M226 126H357" stroke="#245da8" stroke-width="3" marker-end="url(#b)"/><text x="450" y="135" font-size="27">ピルビン酸</text><path d="M450 149V181" stroke="#596573" stroke-width="3" marker-end="url(#a)"/><text x="450" y="219" font-size="28" font-weight="700">acetyl-CoA</text><path d="M450 236V277" stroke="#596573" stroke-width="3" marker-end="url(#a)"/><circle cx="450" cy="304" r="9" fill="#596573"/><text x="514" y="289" font-size="25">クエン酸</text><path d="M464 305A140 140 0 0 1 587 430" fill="none" stroke="#596573" stroke-width="3" marker-end="url(#a)"/><path d="M588 459A140 140 0 0 1 452 584" fill="none" stroke="#596573" stroke-width="3" marker-end="url(#a)"/><path d="M432 583A140 140 0 0 1 312 460" fill="none" stroke="#596573" stroke-width="3" marker-end="url(#a)"/><path d="M312 430A140 140 0 0 1 434 305" fill="none" stroke="#596573" stroke-width="3" marker-end="url(#a)"/><text x="450" y="437" font-size="31" font-weight="700">TCA回路</text><text x="450" y="470" font-size="22">ATP産生へつながる</text><circle cx="310" cy="444" r="9" fill="#596573"/><circle cx="590" cy="444" r="9" fill="#596573"/><text x="127" y="354" font-size="26" font-weight="700" fill="#245da8">アスパラギン酸</text><path d="M127 369V444H287" fill="none" stroke="#245da8" stroke-width="3" marker-end="url(#b)"/><text x="212" y="492" font-size="23">オキサロ酢酸</text><text x="773" y="354" font-size="26" font-weight="700" fill="#245da8">グルタミン酸</text><path d="M773 369V444H613" fill="none" stroke="#245da8" stroke-width="3" marker-end="url(#b)"/><text x="705" y="492" font-size="23">α-ケトグルタル酸</text><text x="450" y="630" font-size="20" fill="#606773">代表的な3例。途中の反応・補酵素・窒素の移動は省略。</text></g></svg>